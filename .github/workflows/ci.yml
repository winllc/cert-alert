name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/reports/tests/test

  test-postgres:
    # The whole test suite again, on PostgreSQL rather than the in-memory H2 the build uses:
    # production runs on PostgreSQL, and this is what runs every Flyway migration against it
    # and holds the queries to its dialect. The test profile's datasource is replaced from
    # the environment, which outranks it.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: certalert
          POSTGRES_USER: certalert
          POSTGRES_PASSWORD: certalert
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U certalert -d certalert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/certalert
      SPRING_DATASOURCE_USERNAME: certalert
      SPRING_DATASOURCE_PASSWORD: certalert
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test on PostgreSQL
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-postgres
          path: build/reports/tests/test

  a11y:
    # Accessibility (Section 508 / WCAG 2.1 AA): every page - signed out, and signed in as an
    # administrator of the demo profile's generated directory, with the classification and
    # consent banners on - scanned with axe-core in Chromium (a11y/scan.mjs, driven by
    # AccessibilityScanTest), failing on any serious or critical violation, plus a keyboard
    # check of the skip link. The runner's own Node; the packages pinned by the lock file.
    # Ubuntu 24.04, not ubuntu-latest: ubuntu-latest now gives Ubuntu 26.04, for which Playwright 1.56.1 installs no
    # browser ("Playwright does not support chromium on ubuntu26.04-x64"). Move this to ubuntu-latest again together
    # with a Playwright release that supports 26.04.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install the scan and its browser
        run: |
          npm ci --prefix a11y --no-audit --no-fund
          cd a11y && npx playwright install --with-deps chromium

      - name: Scan every page with axe-core
        run: ./gradlew a11yTest --no-daemon

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: build/reports/a11y

  helm:
    # The Helm chart (deploy/helm/cert-alert): linted strictly and rendered with every example
    # values file in ci/, and the output validated against the Kubernetes 1.29 schemas.
    runs-on: ubuntu-latest

    env:
      CHART: deploy/helm/cert-alert
      KUBECONFORM_VERSION: v0.6.7
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm lint --strict -f $values"
            helm lint --strict "$CHART" -f "$values"
            echo "::endgroup::"
          done

      - name: The license volume survives uninstall and prune
        run: |
          # It may hold the installation id an upgraded installation has yet to import.
          pvc=$(helm template cert-alert "$CHART" -f "$CHART/ci/default-values.yaml" \
            | awk '/^kind: PersistentVolumeClaim$/{p=1} p&&/^---/{p=0} p')
          echo "$pvc" | grep -q 'helm.sh/resource-policy: keep'
          echo "$pvc" | grep -q 'argocd.argoproj.io/sync-options: Prune=false'

      - name: The license menu setting is passed only when it is false
        run: |
          # Unset or true leaves the application's default (shown); false is passed on.
          # (An if, not "! cmd": bash -e does not stop on a negated command.)
          if helm template cert-alert "$CHART" -f "$CHART/ci/default-values.yaml" \
              | grep -q 'ENS_LICENSE_MENU_VISIBLE'; then
            echo "::error::ENS_LICENSE_MENU_VISIBLE rendered with the default values"
            exit 1
          fi
          helm template cert-alert "$CHART" -f "$CHART/ci/ingress-values.yaml" \
            | grep -q 'ENS_LICENSE_MENU_VISIBLE: "false"'

      - name: Render and validate
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm template -f $values | kubeconform"
            # The OpenShift Route has no schema in the Kubernetes set; only that example
            # renders one, so only it may skip missing schemas.
            extra=()
            case "$values" in *openshift*) extra=(-ignore-missing-schemas) ;; esac
            # ServiceMonitor (Prometheus Operator) is validated against the CRDs catalog.
            helm template cert-alert "$CHART" -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  "${extra[@]}"
            echo "::endgroup::"
          done

  release-bundle:
    # The customer bundle's files (deploy/release), without building anything: shellcheck on
    # its scripts, and its compose files rendered by docker compose and by podman-compose in
    # every combination its README documents; and that docker-compose.demo.yml publishes no
    # port. The image job below installs the built bundle.
    runs-on: ubuntu-latest

    env:
      PODMAN_COMPOSE_VERSION: 1.6.0
      SHELLCHECK_VERSION: 0.11.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install podman-compose and shellcheck
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install -q "podman-compose==$PODMAN_COMPOSE_VERSION" \
            "shellcheck-py==$SHELLCHECK_VERSION"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Check the bundle
        env:
          REQUIRE_ENGINES: docker podman
        run: |
          docker compose version
          podman version
          podman-compose version
          scripts/check-release-bundle.sh

      - name: The demo compose file publishes no port
        run: |
          f=docker-compose.demo.yml
          docker compose -f "$f" -p cert-alert-demo config --format json | python3 -c '
          import json, sys
          bad = [n for n, s in json.load(sys.stdin)["services"].items() if s.get("ports")]
          sys.exit("services with ports: %s" % bad if bad else 0)'
          podman-compose -f "$f" -p cert-alert-demo config > "$RUNNER_TEMP/demo.yml"
          ! grep -n 'ports:' "$RUNNER_TEMP/demo.yml"

  image:
    # Builds the container image on every push, scans it, and publishes what it just proved
    # starts and passes the scan. Nothing is published from a pull request: a fork's token
    # cannot write packages, and an image built from code nobody has reviewed is not one to
    # leave in a registry. On a release tag the image and the chart are signed with cosign
    # (keyless, by this workflow's GitHub identity), and the image's SBOM and its SLSA build
    # provenance attached as attestations.
    runs-on: ubuntu-latest
    needs: build

    # For the release job, which signs and uploads what this one built.
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}

    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a Fulcio certificate.
      id-token: write
      # The build-provenance attestation is recorded on the repository as well as pushed.
      attestations: write

    env:
      # The customer release bundle (see "Release bundle" below and the README's Releases).
      PRODUCT_ID: cert-alert
      # The image scan gate. Pinned, and checked against the release's own checksum.
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      COSIGN_VERSION: v3.1.3
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      RELEASE_S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the release bucket is configured
        # Releases reach customers from the S3 bucket only. On a release tag this fails before anything is
        # built or published, rather than leaving the release in a workflow artifact nobody can reach. The
        # credentials are the release job's, in the `release` environment, and are checked there.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$RELEASE_S3_BUCKET" ]; then
            echo "::error::A release needs the RELEASE_S3_BUCKET repository variable (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "Release goes to s3://$RELEASE_S3_BUCKET"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cert-alert:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            PACKAGES_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers its health probe
        run: |
          # No LDAP and no database here, so it runs on the default H2 file datasource and
          # LDAP reports DOWN. That is expected; what is being checked is that the image is
          # assembled correctly and the application inside it comes up at all.
          docker run -d --name cert-alert -p 8080:8080 cert-alert:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/liveness > /dev/null 2>&1; then
              echo "started after ${i}s"
              curl -fsS http://localhost:8080/actuator/health/liveness
              # Unlicensed - no license is ever in the image - and still able to sign in,
              # so an administrator can reach the license screen to install one.
              curl -fsS -o /dev/null http://localhost:8080/login
              docker exec cert-alert test -w /var/lib/ens/certalert
              docker rm -f cert-alert
              exit 0
            fi
            sleep 1
          done
          echo "did not start"
          docker logs cert-alert
          docker rm -f cert-alert
          exit 1

      - name: Install Trivy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the image for HIGH and CRITICAL vulnerabilities
        run: |
          # Fails the build on any HIGH or CRITICAL finding that has a fix available, in the
          # OS packages or the jars. Accepted risks are in .trivyignore, each with a reason
          # and a date to look at it again.
          trivy image --no-progress --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore \
            cert-alert:ci

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Tagging and pushing the image that was just started and scanned, rather than
          # building it again for the registry: what is published has to be what was tested,
          # down to the layer digests the signature will name.
          for tag in $TAGS; do
            echo "pushing $tag"
            docker tag cert-alert:ci "$tag"
            docker push "$tag"
          done

      - name: Say where it went
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Release bundle -------------------------------------------------------------
      # On a v* tag: the customer bundle for that version - compose file, install scripts and
      # the images just tested and published, with SBOMs, checksums and (when the key is
      # configured) a signature - uploaded to the release bucket. On a pull request: the same
      # bundle as a dry run, kept only as a workflow artifact, so every PR proves it builds.
      # Branch pushes build no bundle.

      - name: Decide the release version
        id: release
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            release=true
            # EULA ships as a placeholder until ENS Solutions supplies its legal text.
            if grep -q '^PLACEHOLDER' EULA; then
              echo "::warning file=EULA::EULA is still the placeholder; replace it with ENS Solutions' agreement."
            fi
          elif [ "$EVENT" = pull_request ]; then
            version="0.0.0-pr${PR_NUMBER}"
            release=false
          else
            echo "No release bundle for a $EVENT of $GITHUB_REF."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "enabled=true"
            echo "version=$version"
            echo "release=$release"
            echo "out_dir=$RUNNER_TEMP/release-$version"
          } >> "$GITHUB_OUTPUT"
          echo "Release bundle $version (release=$release)"

      - name: Install syft
        id: syft
        if: steps.release.outputs.enabled == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up Helm
        if: steps.release.outputs.enabled == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Build the release bundle
        if: steps.release.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE: ${{ steps.release.outputs.release }}
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
          PUBLISHED: ${{ steps.meta.outputs.tags }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          REQUIRE_SBOM: "true"
          # The Helm chart is packaged into the bundle's output at the same version, so it is
          # checksummed, signed, uploaded and kept as an artifact with everything else.
          REQUIRE_CHART: "true"
        run: |
          # The image that passed the smoke test, under the name customers' compose file uses.
          # On a tag it was pushed under that name above; check, rather than ship a bundle
          # whose compose file names an image the registry does not have.
          if [ "$RELEASE" = true ] && ! grep -qxF "$IMAGE_NAME:$VERSION" <<< "$PUBLISHED"; then
            echo "::error::$IMAGE_NAME:$VERSION was not among the published tags"
            exit 1
          fi
          docker tag cert-alert:ci "$IMAGE_NAME:$VERSION"
          scripts/release-bundle.sh "$VERSION" "$IMAGE_NAME:$VERSION"

      - name: Install the bundle with Podman
        # The bundle as a customer unpacks it, installed and upgraded with rootful Podman and
        # podman-compose (systemd runs Podman's health checks), from the images it ships. No
        # directory here, so LDAP reports DOWN, which the liveness check ignores. Checks that a
        # new .env refuses plain HTTP on 0.0.0.0 until CERT_ALERT_ALLOW_PLAIN_HTTP=true, that the
        # UI is then published on 0.0.0.0:8080 of the host, and that a backup restores.
        if: steps.release.outputs.enabled == 'true'
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
          PODMAN_COMPOSE_VERSION: 1.6.0
        run: |
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/pip" install -q "podman-compose==$PODMAN_COMPOSE_VERSION"
          as_root() { sudo env "PATH=$RUNNER_TEMP/podman-compose/bin:$PATH" "$@"; }
          dir="$RUNNER_TEMP/podman-smoke"
          mkdir -p "$dir"
          tar -xzf "$OUT_DIR/$PRODUCT_ID-$VERSION.tar.gz" -C "$dir"
          cd "$dir/$PRODUCT_ID-$VERSION"
          as_root ./install.sh --engine podman
          sudo grep -qx 'CONTAINER_ENGINE=podman' .env
          sudo sed -i -e 's|^CERT_ALERT_LDAP_URL=.*|CERT_ALERT_LDAP_URL=ldap://127.0.0.1:1|' \
            -e 's|=CHANGE_ME$|=ci|' .env
          sudo grep -qE '^CERT_ALERT_WEBHOOKS_SECRET_KEY=.{44}$' .env
          if as_root ./install.sh; then
            echo "::error::install.sh started plain HTTP on 0.0.0.0 without CERT_ALERT_ALLOW_PLAIN_HTTP=true"
            exit 1
          fi
          sudo sed -i -e 's|^CERT_ALERT_ALLOW_PLAIN_HTTP=.*|CERT_ALERT_ALLOW_PLAIN_HTTP=true|' .env
          as_root ./install.sh
          curl -fsS http://127.0.0.1:8080/livez
          ss -ltnH 'sport = :8080' | tee /dev/stderr | grep -q '0\.0\.0\.0:8080'
          as_root ./upgrade.sh
          curl -fsS http://127.0.0.1:8080/livez
          as_root ./backup.sh --out backups/ci.sql.gz
          as_root ./restore.sh backups/ci.sql.gz --yes
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/livez && break; sleep 5; done
          curl -fsS http://127.0.0.1:8080/livez
          as_root podman-compose down -v

      - name: Publish the Helm chart
        # Releases only: a pull request's 0.0.0-pr<n> chart is packaged above and kept as an
        # artifact, never pushed.
        if: steps.release.outputs.enabled == 'true' && steps.release.outputs.release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$OUT_DIR/$PRODUCT_ID-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/helm-push.txt"
          echo "Chart: \`$CHART_REPO/$PRODUCT_ID --version $VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: steps.release.outputs.enabled == 'true' && steps.release.outputs.release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the image and the chart, and attest the image's SBOM
        id: sign-image
        if: steps.release.outputs.enabled == 'true' && steps.release.outputs.release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
          CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          # Keyless: the signature names this workflow, on this repository, at this tag.
          # Always by digest - a tag can be moved, a digest cannot.
          image=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE_NAME:$VERSION")
          case "$image" in "$IMAGE_NAME"@sha256:*) ;; *) echo "::error::no registry digest for $IMAGE_NAME:$VERSION"; exit 1 ;; esac
          cosign sign --yes "$image"
          cosign attest --yes --type spdxjson --predicate "$OUT_DIR/sbom-$PRODUCT_ID.spdx.json" "$image"
          # For the provenance attestation below, which takes the digest on its own.
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"

          chart_digest=$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/helm-push.txt" | head -1)
          [ -n "$chart_digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          cosign sign --yes "$CHART_REPO/$PRODUCT_ID@$chart_digest"
          {
            echo "### Signed"
            echo
            echo "Image \`$image\` (with an SPDX SBOM attestation, and build provenance in the next step)"
            echo "Chart \`$CHART_REPO/$PRODUCT_ID@$chart_digest\`"
            echo
            echo "Verify:"
            echo '```'
            echo "cosign verify $image \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$image --repo ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the image's build provenance
        # SLSA build provenance for the image just signed, by digest: which workflow, commit
        # and runner built it. Signed through Sigstore with this workflow's identity, like the
        # cosign signature, pushed to the registry beside the image and recorded on the
        # repository; `gh attestation verify` (above) checks it. No artifact storage record,
        # which would need a permission of its own.
        if: steps.release.outputs.enabled == 'true' && steps.release.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.sign-image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Keep the bundle as a workflow artifact
        if: steps.release.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.PRODUCT_ID }}-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.out_dir }}
          retention-days: ${{ steps.release.outputs.release == 'true' && 30 || 3 }}
          # The tarball is already compressed.
          compression-level: 0
          if-no-files-found: error

      - name: Summarise the release bundle
        if: always() && steps.release.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE: ${{ steps.release.outputs.release }}
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
        run: |
          {
            echo "### Release bundle \`$PRODUCT_ID $VERSION\`"
            echo
            if [ -d "$OUT_DIR" ] && [ -n "$(ls -A "$OUT_DIR")" ]; then
              echo "| File | Size |"
              echo "|---|---:|"
              for f in "$OUT_DIR"/*; do
                echo "| \`$(basename "$f")\` | $(numfmt --to=iec-i --suffix=B "$(stat -c %s "$f")") |"
              done
            else
              echo "No bundle was produced - see the *Build the release bundle* step."
            fi
            echo
            if [ "$RELEASE" = true ]; then
              echo "The **release** job signs it and uploads it to the bucket, once the \`release\` environment allows it."
            else
              echo "A pull-request dry run: never signed or uploaded."
            fi
            echo
            echo "Workflow artifact: \`release-$PRODUCT_ID-$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # A release tag only: signs the bundle's checksums with the GPG key and uploads the bundle to the
    # release bucket. Its own job, in the `release` environment, so the signing key and the bucket's
    # credentials can be kept there behind required reviewers and a tag-only deployment rule, and are
    # never in a job that builds or runs anything. Pull requests never get here (their dry run ends
    # with the workflow artifact above).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.image.outputs.release == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      # The release role is assumed with this job's OIDC token (aws-actions/configure-aws-credentials).
      id-token: write

    env:
      PRODUCT_ID: cert-alert
      VERSION: ${{ needs.image.outputs.version }}
      # Secrets cannot be tested in a step's `if:`, so whether they are set is mapped here.
      HAS_GPG: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      RELEASE_S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
      RELEASE_S3_ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
      RELEASE_S3_REGION: ${{ vars.RELEASE_S3_REGION || 'us-east-1' }}

    steps:
      - name: Check the bucket and its credentials
        run: |
          missing=()
          [ -n "$RELEASE_S3_BUCKET" ] || missing+=("the RELEASE_S3_BUCKET variable")
          if [ -z "$AWS_RELEASE_ROLE_ARN" ] && [ "$HAS_AWS_KEYS" != true ]; then
            missing+=("the AWS_RELEASE_ROLE_ARN variable (or, until the role exists, the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::A release needs $m (Settings > Secrets and variables > Actions, or the release environment)"; done
            exit 1
          fi
          if [ -z "$AWS_RELEASE_ROLE_ARN" ]; then
            echo "::warning::Uploading with the long-lived AWS_ACCESS_KEY_ID secret. Create the release role and set the AWS_RELEASE_ROLE_ARN variable (README: Releases), then delete the key."
          fi

      - name: Fetch the bundle the image job built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.PRODUCT_ID }}-${{ env.VERSION }}
          path: ${{ runner.temp }}/release-${{ env.VERSION }}

      - name: Sign the checksums
        id: sign
        if: env.HAS_GPG == 'true'
        env:
          OUT_DIR: ${{ runner.temp }}/release-${{ env.VERSION }}
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          # The checksums were made by the image job; check the files still match them before signing.
          (cd "$OUT_DIR" && sha256sum -c --quiet SHA256SUMS)
          # A keyring of its own outside the workspace, removed afterwards. The key only ever
          # goes from the environment into gpg's import.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          [ -n "$key" ] || { echo "::error::RELEASE_GPG_PRIVATE_KEY holds no secret key"; exit 1; }
          sign=(gpg --batch --yes --pinentry-mode loopback --local-user "$key"
                --armor --detach-sign --output "$OUT_DIR/SHA256SUMS.asc")
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" | "${sign[@]}" --passphrase-fd 0 "$OUT_DIR/SHA256SUMS"
          else
            "${sign[@]}" "$OUT_DIR/SHA256SUMS"
          fi
          gpg --batch --verify "$OUT_DIR/SHA256SUMS.asc" "$OUT_DIR/SHA256SUMS"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Assume the release role
        # Short-lived credentials for the release role, through GitHub's OIDC: no stored key.
        if: env.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: ${{ env.PRODUCT_ID }}-release-${{ github.run_id }}
          aws-region: ${{ env.RELEASE_S3_REGION }}

      - name: Use the access key (fallback)
        # Until the role exists: the long-lived key, as releases before the role did (warned above).
        if: env.AWS_RELEASE_ROLE_ARN == '' && env.HAS_AWS_KEYS == 'true'
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=$KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY"
            echo "AWS_DEFAULT_REGION=$RELEASE_S3_REGION"
          } >> "$GITHUB_ENV"

      - name: Upload the release to the bucket
        id: upload
        env:
          OUT_DIR: ${{ runner.temp }}/release-${{ env.VERSION }}
        run: |
          # An endpoint for R2 or MinIO; AWS S3 needs none.
          aws_s3=(aws s3)
          [ -z "$RELEASE_S3_ENDPOINT" ] || aws_s3=(aws --endpoint-url "$RELEASE_S3_ENDPOINT" s3)
          dest="s3://$RELEASE_S3_BUCKET/$PRODUCT_ID/$VERSION/"
          for f in "$OUT_DIR"/*; do
            "${aws_s3[@]}" cp --no-progress "$f" "$dest"
          done
          # latest.txt moves only for a final release, never for 1.2.3-rc.1 and the like.
          if [[ "$VERSION" != *-* ]]; then
            printf '%s\n' "$VERSION" > "$RUNNER_TEMP/latest.txt"
            "${aws_s3[@]}" cp --no-progress --content-type text/plain \
              "$RUNNER_TEMP/latest.txt" "s3://$RELEASE_S3_BUCKET/$PRODUCT_ID/latest.txt"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
          echo "location=$dest" >> "$GITHUB_OUTPUT"

      - name: Keep the signed bundle as the workflow artifact
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.PRODUCT_ID }}-${{ env.VERSION }}
          path: ${{ runner.temp }}/release-${{ env.VERSION }}
          overwrite: true
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Summarise the release
        if: always()
        env:
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          SIGN_KEY: ${{ steps.sign.outputs.key }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          UPLOAD_LOCATION: ${{ steps.upload.outputs.location }}
          UPLOAD_LATEST: ${{ steps.upload.outputs.latest }}
        run: |
          {
            echo "### Release \`$PRODUCT_ID $VERSION\`"
            echo
            case "$SIGN_OUTCOME" in
              success) echo "**Signed:** yes, \`SHA256SUMS.asc\` by key \`$SIGN_KEY\`." ;;
              skipped)
                if [ "$HAS_GPG" = true ]; then echo "**Signed:** no - an earlier step failed."
                else echo "**Signed:** no - secret \`RELEASE_GPG_PRIVATE_KEY\` is not configured."; fi ;;
              *) echo "**Signed:** no - signing failed." ;;
            esac
            if [ -n "$AWS_RELEASE_ROLE_ARN" ]; then echo "**Credentials:** the release role, through OIDC."
            else echo "**Credentials:** the long-lived access key (fallback) - set \`AWS_RELEASE_ROLE_ARN\`."; fi
            case "$UPLOAD_OUTCOME" in
              success)
                echo "**Uploaded:** \`$UPLOAD_LOCATION\`"
                if [ "$UPLOAD_LATEST" = true ]; then echo "and \`$PRODUCT_ID/latest.txt\` now says $VERSION."
                else echo "(a pre-release, so \`$PRODUCT_ID/latest.txt\` was left alone)."; fi ;;
              skipped) echo "**Uploaded:** no - an earlier step failed." ;;
              *) echo "**Uploaded:** no - the upload failed." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
