name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test

  image:
    # Builds the container image on every push, and publishes what it just proved starts.
    # Nothing is published from a pull request: a fork's token cannot write packages, and
    # an image built from code nobody has reviewed is not one to leave in a registry.
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cert-alert:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers its health probe
        run: |
          # No LDAP and no database here, so it runs on the default H2 file datasource and
          # LDAP reports DOWN. That is expected; what is being checked is that the image is
          # assembled correctly and the application inside it comes up at all.
          docker run -d --name cert-alert -p 8080:8080 cert-alert:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/liveness > /dev/null 2>&1; then
              echo "started after ${i}s"
              curl -fsS http://localhost:8080/actuator/health/liveness
              docker rm -f cert-alert
              exit 0
            fi
            sleep 1
          done
          echo "did not start"
          docker logs cert-alert
          docker rm -f cert-alert
          exit 1

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Tagging and pushing the image that was just started, rather than building it
          # again for the registry. The Dockerfile's base images default to floating tags,
          # so a second build can pick up a different base than the one that passed above -
          # and what is published has to be what was tested.
          for tag in $TAGS; do
            echo "pushing $tag"
            docker tag cert-alert:ci "$tag"
            docker push "$tag"
          done

      - name: Say where it went
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
