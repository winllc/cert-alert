name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test

  image:
    # Builds the container image on every push. Nothing is pushed to a registry: the point
    # is to find out here, rather than on somebody's deploy, if the Dockerfile has drifted
    # from the build.
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cert-alert:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers its health probe
        run: |
          # No LDAP and no database here, so it runs on the default H2 file datasource and
          # LDAP reports DOWN. That is expected; what is being checked is that the image is
          # assembled correctly and the application inside it comes up at all.
          docker run -d --name cert-alert -p 8080:8080 cert-alert:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/liveness > /dev/null 2>&1; then
              echo "started after ${i}s"
              curl -fsS http://localhost:8080/actuator/health/liveness
              docker rm -f cert-alert
              exit 0
            fi
            sleep 1
          done
          echo "did not start"
          docker logs cert-alert
          docker rm -f cert-alert
          exit 1
