# How many application contexts the test run keeps alive (Spring's default is 32).
#
# Every test class that stands up its own directory (@DynamicPropertySource) or sets
# properties of its own gets a context nobody else uses, and a cached context keeps its
# connection pool, its Hibernate metamodel, its web server and its background threads for
# the rest of the run. Thirty-two of them outgrew the test JVM's 512MB heap, and on
# PostgreSQL held more connections than the server's default limit of 100. Least recently
# used goes first, which is a context used by one class; the shared one is used often
# enough to stay.
spring.test.context.cache.maxSize=8
