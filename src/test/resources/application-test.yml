spring:
  datasource:
    url: jdbc:h2:mem:cert-alert-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

cert-alert:
  security:
    admin-identifiers: [admin@example.gov]
    ldap:
      user-search-base: ou=people
      user-search-filter: "(uid={0})"

  ldap:
    # Deliberately tiny, so even a handful of fixture entries cross page and batch
    # boundaries and the streaming path is what the tests actually exercise.
    page-size: 3
    batch-size: 2
    sync:
      # Tests drive the jobs explicitly; nothing should fire on a timer.
      enabled: false

# A test license covering every feature, signed with the test key that
# src/test/resources/license/ens-license-public.pem overrides the real one with. Relative to
# the module directory, which is where Gradle runs the tests.
ens:
  license:
    file: src/test/resources/license/test.lic

logging:
  level:
    com.winllc.certalert: DEBUG
