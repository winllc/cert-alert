spring:
  datasource:
    url: jdbc:h2:mem:cert-alert-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

cert-alert:
  # The scheduler must not fire during tests; checks are driven explicitly.
  scan-enabled: false

logging:
  level:
    com.winllc.certalert: DEBUG
