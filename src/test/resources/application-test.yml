spring:
  datasource:
    url: jdbc:h2:mem:cert-alert-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

cert-alert:
  revocation:
    # The test CRL publishers and OCSP responders listen on loopback, which revocation
    # fetches refuse unless the host is named.
    allowed-hosts: [localhost, 127.0.0.1]

  security:
    admin-identifiers: [admin@example.gov]
    ldap:
      user-search-base: ou=people
      user-search-filter: "(uid={0})"

  # Tests send queued mail themselves (MailOutbox.deliver / deliverDue); nothing in the
  # background picks up another test's messages.
  mail:
    outbox:
      background: false

  ldap:
    # Deliberately tiny, so even a handful of fixture entries cross page and batch
    # boundaries and the streaming path is what the tests actually exercise.
    page-size: 3
    batch-size: 2
    sync:
      # Tests drive the jobs explicitly; nothing should fire on a timer.
      enabled: false

# The license: TestLicenseConfiguration (src/test/java/.../support) replaces the
# LicenseManager with one that trusts the ENS portal's published TEST key and installs a
# full test license, in a temporary directory, for every context with this profile.

# The audit forwarders and roll-ups run only when a test drives them.
ens:
  audit:
    background: false

logging:
  level:
    com.winllc.certalert: DEBUG
