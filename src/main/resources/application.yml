spring:
  application:
    name: cert-alert

  # Default datasource is an embedded H2 file database so the app runs with no setup.
  # Point these at PostgreSQL (see application-postgres.yml) for anything real.
  datasource:
    url: jdbc:h2:file:./data/cert-alert;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  # Directory connection. Credentials belong in the environment, not in source control.
  ldap:
    urls: ${CERT_ALERT_LDAP_URL:ldap://localhost:389}
    base: ${CERT_ALERT_LDAP_BASE:}
    username: ${CERT_ALERT_LDAP_USER:}
    password: ${CERT_ALERT_LDAP_PASSWORD:}

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized

cert-alert:
  # Certificates expiring inside this window are reported as EXPIRING_SOON.
  warning-threshold-days: 30
  # ...and escalated to CRITICAL severity inside this one.
  critical-threshold-days: 7

  ldap:
    sync-enabled: true
    # Every six hours, in UTC.
    sync-cron: "0 0 */6 * * *"
    page-size: 500
    paged: true
    search-timeout: 60s

    # ---------------------------------------------------------------------------------
    # Attribute mapping. Defaults follow inetOrgPerson (RFC 2798) for people and device
    # (RFC 4519) for servers. Confirm every name against your directory's schema before
    # the first run: a wrong name silently yields a null column, not an error.
    # ---------------------------------------------------------------------------------
    user:
      search-base: ""
      search-filter: "(objectClass=inetOrgPerson)"
      uid: uid
      common-name: cn
      display-name: displayName
      given-name: givenName
      surname: sn
      email: mail
      telephone-number: telephoneNumber
      title: title
      employee-type: employeeType
      country: c
      organization: o
      organizational-unit: ou
      certificate: userCertificate

    server:
      search-base: ""
      search-filter: "(objectClass=device)"
      common-name: cn
      fqdn: associatedDomain
      description: description
      serial-number: serialNumber
      operating-system: operatingSystem
      # Joined to a user's email address to answer "which servers is this person responsible for".
      server-poc: serverPoc
      organization: o
      organizational-unit: ou
      certificate: userCertificate

  alerts:
    logging:
      enabled: true
    email:
      enabled: false
      from: cert-alert@localhost
      to: []
      subject-prefix: "[cert-alert] "

logging:
  level:
    com.winllc.certalert: INFO
