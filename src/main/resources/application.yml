spring:
  application:
    name: cert-alert

  lifecycle:
    # How long graceful shutdown (see server.shutdown) may take before it is cut short.
    timeout-per-shutdown-phase: 30s

  # Default datasource is an embedded H2 file database so the app runs with no setup.
  # Point these at PostgreSQL (see application-postgres.yml) for anything real.
  datasource:
    url: jdbc:h2:file:./data/cert-alert;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Sync batches are written as JDBC batches. Entities use sequence ids precisely
          # so this is possible: an identity column forces a round trip per insert.
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        order_by:
          # Where a NULL sorts is left undefined by the standard and databases disagree -
          # H2 puts them first ascending, PostgreSQL last. The tables sort by expiry, and
          # an entry that publishes no certificate has none: leaving it to the database
          # would head the "soonest to expire" list with every entry that has nothing to
          # expire on one, and not on the other. Said here, so both behave the same.
          default_null_ordering: last

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  thymeleaf:
    # The pages, and the packaged HTML emails. Last of four resolvers: ahead of it sit a
    # deployment's own email templates, where one is configured, and then the packaged
    # plain-text ones - which carry a resolver of their own because a resolver carries one
    # template mode. See EmailTemplateConfig, where the order is spelled out.
    template-resolver-order: 4

  # Directory connection. Credentials belong in the environment, not in source control.
  ldap:
    urls: ${CERT_ALERT_LDAP_URL:ldap://localhost:389}
    base: ${CERT_ALERT_LDAP_BASE:}
    username: ${CERT_ALERT_LDAP_USER:}
    password: ${CERT_ALERT_LDAP_PASSWORD:}
    # Extra JNDI properties, applied to every connection the application opens - the two
    # that read certificates by absolute name included, not just the sweep's.
    #
    # The one worth knowing about is which attributes the provider hands back as bytes
    # rather than decoding as text. It already knows the standard names, userCertificate
    # among them, so this is only needed for a certificate attribute renamed under
    # cert-alert.ldap, and only with binary-certificate-option off:
    #
    #   base-environment:
    #     java.naming.ldap.attributes.binary: myCertificateAttribute
    #
    # And the two that keep a directory that stops answering from stopping everything with
    # it: how long to wait for a connection, and for each answer - one page of a sweep, a
    # sign-in's bind. Milliseconds, because that is what the provider reads. A directory that
    # takes longer than a minute to return one page of a search needs the second raised.
    base-environment:
      "[com.sun.jndi.ldap.connect.timeout]": ${CERT_ALERT_LDAP_CONNECT_TIMEOUT_MS:10000}
      "[com.sun.jndi.ldap.read.timeout]": ${CERT_ALERT_LDAP_READ_TIMEOUT_MS:60000}

  # The mail server itself is configured with spring.mail.host and friends (see the README).
  # These are the waits: JavaMail's own default for each is forever, and a mail server that
  # accepts a connection and then says nothing would hold whatever was sending.
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": ${CERT_ALERT_MAIL_CONNECT_TIMEOUT_MS:30000}
      "[mail.smtp.timeout]": ${CERT_ALERT_MAIL_READ_TIMEOUT_MS:30000}
      "[mail.smtp.writetimeout]": ${CERT_ALERT_MAIL_WRITE_TIMEOUT_MS:30000}
      "[mail.smtps.connectiontimeout]": ${CERT_ALERT_MAIL_CONNECT_TIMEOUT_MS:30000}
      "[mail.smtps.timeout]": ${CERT_ALERT_MAIL_READ_TIMEOUT_MS:30000}
      "[mail.smtps.writetimeout]": ${CERT_ALERT_MAIL_WRITE_TIMEOUT_MS:30000}

server:
  port: 8080
  error:
    include-message: never

  # Redirects say "/login", not "http://<the host this server thinks it has>/login". Behind a
  # proxy that does not pass the original host and scheme on (or before
  # SERVER_FORWARD_HEADERS_STRATEGY is set), an absolute one names the wrong origin: a sign-in's
  # redirect to it is then refused by the Content-Security-Policy's form-action 'self', and the
  # Sign in button seems to do nothing. A relative one is resolved by the browser against the
  # address it actually used.
  tomcat:
    use-relative-redirects: true

  # A container stops with SIGTERM. Finishing in-flight requests, and letting the changelog
  # connector stop between changes rather than mid-batch, is worth a few seconds.
  shutdown: graceful

  servlet:
    session:
      # Before sign-in, and for anything that does not say otherwise. Set from
      # ENS_SESSION_IDLE_TIMEOUT; SERVER_SERVLET_SESSION_TIMEOUT still works and wins.
      # 15 minutes by default, as the STIG asks; it was 30 before.
      timeout: ${ENS_SESSION_IDLE_TIMEOUT:15m}
      cookie:
        # Never readable from script, and not sent on cross-site requests other than a
        # top-level navigation. Secure is set by the container on any request that arrived
        # over TLS - directly, or behind a proxy with server.forward-headers-strategy set -
        # and always with ENS_COOKIE_SECURE=true, for a proxy that terminates TLS and does not
        # say so.
        http-only: true
        same-site: lax
        secure: ${ENS_COOKIE_SECURE:false}

  # X.509 needs TLS with client authentication. "want" is deliberate: with "need", a
  # browser holding no certificate cannot even reach the login form, so the password
  # fallback becomes unreachable.
  ssl:
    enabled: ${CERT_ALERT_TLS_ENABLED:false}
    # TLS 1.2 and 1.3 only. Everything older is broken or deprecated (RFC 8996), and a client
    # that cannot do 1.2 is not one to hand a session to.
    enabled-protocols: TLSv1.3,TLSv1.2
    # FIPS-approved suites only (NIST SP 800-52 Rev. 2): AES-GCM, with ECDHE for TLS 1.2 so
    # every session has forward secrecy. No ChaCha20, no CBC, no static RSA key exchange.
    # CERT_ALERT_TLS_CIPHERS replaces the list (comma-separated, IANA names) for a client
    # that cannot use any of these - say so to ENS support.
    ciphers: ${CERT_ALERT_TLS_CIPHERS:TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256}
    client-auth: want
    key-store: ${CERT_ALERT_KEYSTORE:}
    key-store-password: ${CERT_ALERT_KEYSTORE_PASSWORD:}
    key-store-type: ${CERT_ALERT_KEYSTORE_TYPE:PKCS12}
    # The CAs whose client certificates are accepted at the handshake. Being in here only
    # gets a certificate as far as the application; it still has to be one the directory
    # publishes.
    trust-store: ${CERT_ALERT_TRUSTSTORE:}
    trust-store-password: ${CERT_ALERT_TRUSTSTORE_PASSWORD:}
    trust-store-type: ${CERT_ALERT_TRUSTSTORE_TYPE:PKCS12}

# The actuator. On the application's own port: health (open), info (open), metrics and
# loggers (administrators) - as before. Set MANAGEMENT_SERVER_PORT (e.g. 9090) to move the
# actuator to a port of its own, which is never published: there health and Prometheus
# (/actuator/prometheus) are open without signing in, and Prometheus is served nowhere else.
# /livez and /readyz stay on the application's port either way.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Liveness and readiness as their own endpoints. An orchestrator should probe these,
      # not the aggregate: the aggregate turns DOWN when the directory is unreachable, and
      # that is not a reason to restart a process that is still serving cached data
      # perfectly well.
      probes:
        enabled: true
        # /livez and /readyz on the application's port, also when the actuator has its own.
        add-additional-paths: true
      group:
        # The process itself, nothing it talks to.
        liveness:
          include: livenessState
        # What it cannot serve without: the database, and an audit log it can write (a
        # sign-in that cannot be audited is refused). Not the directory: everything here
        # is served from the cache and certificates sign in from it, so a directory outage
        # is a reason to page somebody, not to stop serving. Add ldap here
        # (MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE) to make it one.
        readiness:
          include: readinessState,db,auditLog

# The ENS Solutions license is not configured here. Where it is kept comes from the
# environment - ENS_LICENSE_FILE (default /etc/ens/certalert.lic) and ENS_LICENSE_STATE_DIR
# (default /var/lib/ens/certalert), which the container image points at its
# /var/lib/ens/certalert volume - and the keys it is checked against are built in. See the
# README's Licensing section.

cert-alert:
  # The fixed bars across the top and bottom of every page - what an accredited network
  # normally requires: the classification of what is on the screen, where a screenshot or
  # a photograph of the monitor cannot be taken without it.
  #
  # Off by default. An application that invents its own classification marking is worse
  # than one that shows none, so the text is yours to set.
  banner:
    enabled: ${CERT_ALERT_BANNER_ENABLED:false}
    # Shown at both ends. Rendered as text, so ampersands and angle brackets are safe.
    text: ${CERT_ALERT_BANNER_TEXT:}
    # A hex colour or a CSS colour keyword. Anything else falls back to the default,
    # because these are written into a stylesheet rather than into escapable text.
    text-color: ${CERT_ALERT_BANNER_TEXT_COLOR:#ffffff}
    background: ${CERT_ALERT_BANNER_BACKGROUND:#1d273b}
    # A number and a unit: px, rem, em, pt or vh. The page is padded by this much at each
    # end so nothing sits underneath a bar.
    height: ${CERT_ALERT_BANNER_HEIGHT:1.5rem}

  # Certificates expiring inside this window are reported as EXPIRING_SOON.
  warning-threshold-days: 30
  # ...and escalated to CRITICAL severity inside this one.
  critical-threshold-days: 7

  ldap:
    # Entries per LDAP page. Every directory caps how many entries one search may return,
    # so paging is not optional at this scale: an unpaged search silently truncates.
    page-size: 500
    paged: true
    # Entries written per transaction.
    batch-size: 200
    # Zero means no client-side cap; the directory's own limits still apply per page.
    count-limit: 0
    search-timeout: 10m

    # Whether to ask for the certificate as `userCertificate;binary`. RFC 4522 requires
    # that form and some directories return nothing without it, which is why it is on.
    #
    # Turn it off for a server that has no such attribute to hand back and answers the
    # qualified request with an empty result - a virtual directory in front of some other
    # store, Radiant Logic FID 7.4 among them. The symptom is entries that sync with every
    # attribute populated and no certificates at all.
    #
    # With it off the provider decides how values arrive, from the attribute's name. It
    # knows the standard ones; a certificate under a name of your own needs declaring
    # under spring.ldap.base-environment above, or it arrives as text and will not parse.
    binary-certificate-option: ${CERT_ALERT_LDAP_BINARY_CERTIFICATE_OPTION:true}

    # What an API token or scheduled report does when its owner's lockout length cannot be
    # found: a pwdAccountLockedTime with no pwdPolicySubentry (olcPPolicyDefault), or whose
    # policy entry is not there, or an AD lockoutTime with no domain lockoutDuration. Unset,
    # such an account is locked until an administrator clears the lock. Set to the directory's
    # real lockout length (never shorter) to let such a lockout lapse after that long.
    # lockout:
    #   assumed-duration: 30m

    sync:
      enabled: true
      # The two sweeps are staggered so they never run at once.
      users-cron: "0 0 2 * * *"
      servers-cron: "0 0 4 * * *"
      # Re-evaluates cached expiry only; reads no LDAP, so it can run often.
      refresh-cron: "0 15 * * * *"

    # The connector that follows the directory's changelog, so a change shows up in seconds
    # rather than waiting for the next sweep. Off by default: a directory that publishes no
    # changelog, or does not let this account read it, would leave it erroring on a loop, and
    # the sweeps already keep the cache correct on their own.
    # Deleting from the directory the certificates it should not still be publishing -
    # revoked ones above all, since something that reads the directory and does not check
    # revocation will pick one up and use it. The only job here that writes to the
    # directory, and what it writes cannot be undone from here, so it is off by default and
    # the windows are generous. Check GET /api/v1/sync/certificate-cleanup/preview first,
    # and grant the service account write on the certificate attribute and nothing else.
    certificate-cleanup:
      enabled: false
      cron: "0 0 3 * * SAT"
      remove-expired: true
      # Long enough that a skewed clock or a late renewal cannot make one eligible.
      expired-after: 90d
      remove-revoked: true
      # Shorter: an expired certificate is untidy, a published revoked one is a hazard.
      revoked-after: 7d
      # A cap rather than a target. A mistake caught after 500 removals is a different kind
      # of morning from one caught after 50,000.
      max-per-run: 500

    changelog:
      enabled: false
      base-dn: cn=changelog
      filter: "(&(objectClass=changeLogEntry)(changeNumber>={0}))"
      poll-interval: 10s
      batch-size: 500
      # LATEST or BEGINNING. LATEST is right after a full sweep has populated the cache;
      # replaying the directory's whole retained history would reach the same place.
      start-from: LATEST
      # Following a changelog keeps a cache current, it does not populate one. With no
      # stored position the connector reads the whole tree once before it starts following,
      # so switching it on is enough on its own. It runs once, not on every restart.
      full-sync-on-first-run: true
      # A trimmed changelog means changes were lost to the connector; the only way back to a
      # correct cache is to read the tree again.
      full-sync-on-gap: true
      max-backoff: 5m
      change-number-attribute: changeNumber
      target-dn-attribute: targetDN
      change-type-attribute: changeType
      new-rdn-attribute: newRDN
      new-superior-attribute: newSuperior
      first-change-number-attribute: firstChangeNumber
      last-change-number-attribute: lastChangeNumber

    prune:
      # Off by default. Turn on once you have checked GET /api/v1/sync/prune/preview.
      enabled: false
      cron: "0 0 6 * * SUN"
      # Wants to be comfortably longer than the sync interval, so a run of failed sweeps
      # can never delete the directory.
      after: 30d

    # ---------------------------------------------------------------------------------
    # Attribute mapping, following the IC FSD schema (FSD v2021-NOV). The specification
    # leaves the actual objectClass hierarchy to the implementing IC Element, so confirm
    # these against your directory: a wrong name yields a null column, not an error.
    # ---------------------------------------------------------------------------------
    user:
      search-base: ""
      search-filter: "(objectClass=icOrgPerson)"
      # A person may hold four network addresses at once; this decides which one leads.
      # All of them are indexed for the point-of-contact join regardless.
      email-precedence: [icEmail, mail, internetEmail, siprnetEmail, niprnetEmail]
      # Attributes beyond the five the schema defines, named as your directory names them.
      # An address found in one is indexed like any other the person answers to, so a
      # serverPOC written with it resolves to them. Values are read whole and split on
      # commas; anything that is not an address is dropped and logged against the entry.
      # Name one here in email-precedence above to make it the primary address.
      additional-email-attributes: []
      uid: uid
      common-name: cn
      display-name: displayName
      preferred-name: preferredName
      given-name: givenName
      surname: sn
      mail: mail
      ic-email: icEmail
      internet-email: internetEmail
      niprnet-email: niprnetEmail
      siprnet-email: siprnetEmail
      telephone-number: telephoneNumber
      title: title
      employee-type: employeeType
      rank: rank
      country-of-affiliation: countryOfAffiliation
      duty-organization: dutyOrganization
      admin-organization: adminOrganization
      ic-member: isICMember
      ic-networks: icNetworks
      resource-security-mark: resourceSecurityMark
      organization: o
      organizational-unit: ou
      certificate: userCertificate

    server:
      search-base: ""
      search-filter: "(objectClass=icOrgServer)"
      common-name: cn
      uid: uid
      given-name: givenName
      description: description
      server-url: serverURL
      ic-server-address: icServerAddress
      ato-status: ATOStatus
      life-cycle-status: lifeCycleStatus
      employee-type: employeeType
      country-of-affiliation: countryOfAffiliation
      duty-organization: dutyOrganization
      admin-organization: adminOrganization
      ic-member: isICMember
      ic-networks: icNetworks
      resource-security-mark: resourceSecurityMark
      # The point of contact. The specification defines this as the NAME of the responsible
      # IC Person or organization; it is matched against every value that could name a
      # person, so a directory that puts an address here works just as well.
      server-poc: serverPOC
      # A value carrying several contacts comma-separated is split into one each, whatever
      # the convention. The attribute is multi-valued and a directory can hold three
      # contacts as three values, but one filled in through a form often holds them as one
      # value - and read whole that matches nobody, so the server appears to have no
      # contacts and nobody hears about its certificate.
      #
      # This then says what a value has to be. True where the directory puts addresses in
      # this attribute: anything that is not one is bad data, so it is dropped rather than
      # cached as a contact nothing can be sent to, and logged with the entry's name so it
      # can be corrected at the source. Set it false for a directory that follows the
      # specification and holds names, or one carrying both.
      require-email-poc: ${CERT_ALERT_LDAP_REQUIRE_EMAIL_POC:true}
      organization: o
      organizational-unit: ou
      certificate: userCertificate

  security:
    # Turning this off leaves the application open. Local development only.
    enabled: true
    # Who administers, by an address the directory publishes for them, their uid, or the
    # DN of their entry. Not a common or display name: two people can share one, and the
    # directory lets anybody be called anything. Not an address added in this application
    # either - one of these cannot be added as one. Everyone else who signs in can read the
    # tables but cannot trigger jobs.
    admin-identifiers: []

    # Who may edit a server's points of contact: ADMIN or AUTHENTICATED. A contact decides
    # who hears that a certificate is about to expire, which is routing rather than
    # annotation - so administrators by default. Open it up where the people who run the
    # servers are expected to keep their own contacts current.
    contact-editors: ADMIN

    x509:
      enabled: true
      # Match the presented certificate against the ones the directory publishes, by
      # fingerprint. Turning this off falls back to matching the uid and addresses in its
      # subject and subject alternative names against what the directory publishes for a
      # person, which trusts a name rather than a key. Its common name is never matched.
      require-known-certificate: true

    ldap:
      # The password fallback. Set false for a deployment that wants certificates only.
      enabled: true
      user-search-base: ""
      user-search-filter: "(uid={0})"
      # Bind straight to these instead of searching, for directories that permit no
      # anonymous search, e.g. ["uid={0},ou=people"].
      user-dn-patterns: []

  # Where signed-in sessions are kept. memory: in the servlet container, as before - lost
  # when it restarts, and seen by that replica only. jdbc: in the database (spring_session),
  # so a session survives a restart and any replica can serve it. The postgres profile, which
  # the chart and the release bundle run, defaults to jdbc.
  session:
    store: ${CERT_ALERT_SESSION_STORE:memory}

  # More than one replica. Every scheduled job, and the same job started by hand, takes a
  # lock in the database (shedlock) first, so it runs on one replica at a time; a run started
  # by hand answers 202 and is asked after at /api/v1/jobs/{id} (job_run).
  cluster:
    # How long a job's lock lasts before it is renewed (at half this, while the job runs).
    # A replica that dies holding one releases it after this long.
    lock-at-most-for: ${CERT_ALERT_CLUSTER_LOCK_AT_MOST_FOR:10m}
    # How long a run started by hand is kept for the page to ask after.
    run-retention: 7d
    # A run whose replica has not said it is still at work for this long is marked failed.
    stale-run-after: 5m

  # The history of directory entries: what happened to an entry, and who did it. Written
  # for changes only - a sweep that finds everything as it left it writes nothing. These
  # records are part of the ens-audit/1 trail (ens.audit, below), alongside sign-ins,
  # refusals, settings, the license and job runs.
  audit:
    # Off stops the entry-change records only. Security events are always recorded.
    enabled: true
    retention:
      # Off by default. An audit trail that quietly deletes itself is worse than one that
      # grows. ENS_AUDIT_RETENTION_DAYS, when above 0, takes precedence over these two; with
      # it at 0 (its default) turning this on prunes after "after", as it always did.
      enabled: false
      after: 365d
      # Daily. Pruning only removes what every forwarding output has delivered.
      cron: "0 30 3 * * *"

  # What a certificate is good for, as distinct from what state it is in. A wildcard covers
  # hosts that do not exist yet; forty names means one key for forty things. Both are
  # judgements rather than rules - a load balancer fronting forty services has forty names
  # for a reason - so where "too many" starts is configuration.
  # Asking the issuing authorities which cached certificates they have revoked - the one
  # question about a certificate that the certificate cannot answer. Its own schedule,
  # after both sweeps, because it is work against the certificates' own authorities rather
  # than against the directory.
  revocation:
    enabled: true
    cron: "0 30 5 * * *"
    # A directory of CA certificates, PEM or DER. Two things need them: OCSP names a
    # certificate by hashes of its issuer's name and key, which only the issuer's
    # certificate carries, and a CRL is signed by the issuer. Unset means OCSP is
    # unavailable and CRLs are used unverified - which every such result says.
    issuer-directory:
    # A responder to ask about a certificate that names none of its own. The address
    # belongs in the certificate's authority information access extension, and a check has
    # nowhere to go without one - but an internal CA issuing inside one network often
    # leaves it out, because everything that will ever validate the certificate already
    # knows where the responder is.
    #
    # Only a fallback: a certificate that names its own responder is asked at that one, and
    # a result that came from this says "(configured default)" so it is never mistaken for
    # the issuer's own answer. An issuer certificate is still needed either way.
    default-ocsp-url: ${CERT_ALERT_DEFAULT_OCSP_URL:}
    # And where to fetch the list for a certificate that names no distribution point, for
    # the same reason. Prefer this one on a directory of any size: a list is one download
    # that answers for every certificate the authority issued, where a responder is one
    # request each and a read of the entry to form it. A list signed by some other
    # authority fails its signature check, so a wrong address here cannot read as good news.
    default-crl-url: ${CERT_ALERT_DEFAULT_CRL_URL:}
    # How many certificates to ask about at once. Only OCSP spends this - a list answers
    # for a whole authority in one download - and the work is all waiting, so asked one
    # after another a large directory never finishes. Set to 1 for one at a time.
    workers: 8
    allow-unverified-crl: true
    crl-cache-ttl: 6h
    # Counted as it downloads; a list over this is dropped there and then.
    max-crl-bytes: 16777216
    connect-timeout: 10s
    read-timeout: 30s
    # The whole of one download, redirects included.
    max-fetch-time: 60s
    # Where lists and responders may be fetched from, when set: host names, *.domain, or
    # addresses and ranges (10.20.0.0/16). Empty: wherever the certificates say - except
    # link-local and cloud metadata addresses, which are never fetched from, and loopback,
    # which is only fetched from when named here. The hosts of default-ocsp-url and
    # default-crl-url are always allowed. Redirects are followed to http and https only.
    allowed-hosts: ${CERT_ALERT_REVOCATION_ALLOWED_HOSTS:}

  # Asking a server's endpoint what it is actually serving, from its page. The one
  # outbound connection here that is not to the directory or the mail server, and the only
  # one somebody causes by pressing a button - so it can be switched off wholesale.
  probe:
    enabled: true
    # Offered when the entry's serverURL names no port.
    default-port: 443
    connect-timeout: 5s
    read-timeout: 5s

  # A person is issued two certificates at once - one to sign with, one to be encrypted to -
  # and a CA signs them minutes apart. This is how close together they have to be to count
  # as one renewal; wider apart means one was renewed and the other was not.
  credentials:
    pair-window: 7d

  risk:
    max-subject-alt-names: 20
    max-domains: 3

  # Telling the people concerned, as distinct from the alert channels below - those tell a
  # fixed list of operators about everything as it happens. A certificate crossing into a
  # bad state shows up on the page for each of its points of contact straight away; a daily
  # round-up of what is expiring goes to them by email.
  notifications:
    enabled: true
    # Nobody hears the same thing twice inside this. A nightly sweep and a certificate that
    # stays expiring for a month would otherwise mean thirty notifications.
    repeat-after: 7d
    digest:
      enabled: true
      cron: "0 0 7 * * *"
      # How many days before expiry the round-up starts reporting a certificate. This is
      # the starting point only: it is set from the notifications page after that, because
      # the people who know the right answer are not the people with access to this file.
      # Clearing the row the page writes (notification_setting) comes back to this.
      window: 30d
      include-expired: true
      # How far back an expired certificate is still reported. Older ones are left out:
      # finished with, or reported every day since. 0 means no limit.
      expired-look-back: ${CERT_ALERT_NOTIFICATIONS_DIGEST_EXPIRED_LOOK_BACK:90d}
      # The most certificates one run reads of each kind - about to expire, and already
      # expired (inside the look-back) but still depended on - each to its own limit, the
      # first read first, page-size at a time. Certificates already renewed are left out by
      # the query and count against neither. A run that reaches either limit says which in
      # a warning and counts it in ens_certalert_digest_truncated_total; raise this if it does.
      scan-limit: 50000
      page-size: 1000
    email:
      # Off by default, and needs spring.mail.* configured. This writes to the contact of
      # the certificate rather than to a fixed list. The message is rendered from the
      # Thymeleaf templates in templates/email: one for a person's own certificates, one
      # for the servers they are a point of contact for, each as HTML and plain text.
      enabled: false
      from: cert-alert@localhost
      subject-prefix: "[cert-alert] "
      max-per-run: 500
      # Build every message and send none of them. For the question nobody wants to answer
      # by finding out: pointed at a real directory for the first time, how many people
      # hear from this, and does what they get read the way it was meant to?
      #
      # A round-up run this way writes nothing down either - no notifications, nothing
      # marked as emailed - and reports who it would have written to and what the message
      # said. There is a Dry run button on the notifications page that does the same for one
      # run without putting the whole deployment into this mode.
      dry-run: ${CERT_ALERT_EMAIL_DRY_RUN:false}
      # Templates of your own, in place of the packaged ones. What these messages say -
      # who signs them, what your renewal process is called, what somebody is meant to do
      # next - is yours, and changing a sentence should not mean rebuilding the image.
      #
      # The layout mirrors the jar, so the files go in an `email` subdirectory of this:
      #   <template-directory>/email/expiring-user.html   .txt
      #   <template-directory>/email/expiring-server.html .txt
      #
      # Only what is there is used; anything missing falls back to the packaged template,
      # so overriding one message does not mean maintaining all four. Read once and cached,
      # so an edit to a mounted file takes effect on the next restart.
      #
      # Deliberately not given an empty default here: the setting has to be absent to be
      # off, and an empty one would build a resolver pointing at whatever directory the
      # process started in. Set it in your own configuration, or in the environment as
      # CERT_ALERT_NOTIFICATIONS_EMAIL_TEMPLATE_DIRECTORY.
      # template-directory: /etc/cert-alert/templates
    retention:
      enabled: false
      after: 90d

  # Every email - round-ups and alerts - is written to an outbox in the transaction that
  # decided to send it, and sent once that commits. One that cannot be sent is tried again,
  # retry-initial later and then twice as long each time up to retry-max, until it is
  # give-up-after old. A newer round-up for the same address replaces one still waiting.
  mail:
    outbox:
      poll-interval: 30s
      retry-initial: 1m
      retry-max: 1h
      give-up-after: 3d
      # Sent, given-up and replaced messages are deleted after this.
      keep: 7d

  alerts:
    logging:
      enabled: true
    email:
      enabled: false
      from: cert-alert@localhost
      to: []
      subject-prefix: "[cert-alert] "

  # Inventory exports (Certificates > Export) and scheduled reports. See the README's
  # "Exports, saved views and scheduled reports".
  exports:
    max-rows: 200000
    report-max-rows: 50000
    max-reports-per-user: 20
    # Domains a scheduled report may be sent to (example.gov, or *.mil). Required: while it is
    # empty no report can be scheduled or sent.
    report-recipient-domains: []
    report-poll-interval: 5m

  # The public API (/api/v1/**, documented at /api/v1/openapi.yaml) for a client holding an
  # API token. Administrators create tokens on Admin > Integrations; each has scopes, an
  # optional expiry, and never more than its creator's roles. See the README's "Public API".
  api:
    tokens-enabled: true
    # Per token, per replica; 429 with Retry-After beyond it. 0 turns the limit off.
    requests-per-minute: 300
    # The longest a token lives: the default expiry, the most that may be asked for, and the
    # age at which any token stops working. 0 removes the limit.
    max-lifetime: 365d
    # A token's reads are audited as one api.token-used event per this interval.
    use-audit-interval: 1h
    max-page-size: 500

  # Outbound webhooks for expiry alerts and job results, configured on Admin > Integrations.
  # Signed with HMAC-SHA256; https only; never to loopback, link-local or metadata addresses.
  webhooks:
    enabled: true
    # Hosts a webhook may go to: names, *.suffix or CIDR ranges. Empty: any host the address
    # rules allow. A host named here may be on a private network.
    allowed-hosts: []
    # Private addresses (10/8, 172.16/12, 192.168/16, 100.64/10, fc00::/7): unset refuses them
    # for new webhooks - a webhook saved before this default keeps its address, with a warning,
    # until its URL changes; true refuses them for every webhook; false allows them for every
    # webhook, as releases before it did.
    # block-private-networks:
    # A base64 AES key the signing secrets are encrypted with in the database.
    # secret-key: ${CERT_ALERT_WEBHOOKS_SECRET_KEY:}
    # An HTTP forward (egress) proxy webhooks go through with CONNECT, to the address the
    # guard checked. Unset: direct. Basic credentials optional; the password from a file
    # (read at each connection) or from CERT_ALERT_WEBHOOKS_PROXY_PASSWORD. Never logged.
    # proxy:
    #   host: proxy.example.gov
    #   port: 3128
    #   username:
    #   password-file: /run/secrets/webhook-proxy-password
    connect-timeout: 5s
    read-timeout: 10s
    # All of one delivery, handshake and slow receivers included; the connection is closed at it.
    delivery-timeout: 30s
    poll-interval: 30s
    # One pass starts no try after run-budget, and gives any one endpoint at most
    # endpoint-tries-per-run tries and endpoint-budget of its time; the rest waits, unclaimed.
    run-budget: 40s
    endpoint-tries-per-run: 10
    endpoint-budget: 20s
    retry-initial: 1m
    retry-max: 1h
    give-up-after: 1d
    keep: 14d

# The ENS platform baseline: the same ENS_* settings, with the same defaults, in every ENS
# product. See the README's "Security headers" section.
ens:
  csp:
    # true sends Content-Security-Policy-Report-Only instead of enforcing the policy: an
    # escape hatch for a page the tests missed, not a way to run.
    report-only: ${ENS_CSP_REPORT_ONLY:false}

  # The DoD notice-and-consent banner, before any sign-in (DISA STIG). Empty title and text
  # mean the standard USG title and DoD text; a file wins over the text. Plain text: blank
  # lines separate paragraphs, lines starting "- " make a list.
  # How long a signed-in session lasts, and how many one person may hold. An ended session
  # goes back to the sign-in page (an API call gets a 401) and is audited as
  # auth.session-expired with its reason: idle, absolute or concurrent.
  session:
    idle-timeout: ${server.servlet.session.timeout}
    # Unset means the same as idle-timeout. The STIG suggests 15m.
    admin-idle-timeout: ${ENS_SESSION_ADMIN_IDLE_TIMEOUT:}
    absolute-timeout: ${ENS_SESSION_ABSOLUTE_TIMEOUT:12h}
    # 0 is no limit; beyond it, signing in ends the person's oldest session. The STIG
    # suggests 3.
    max-per-user: ${ENS_SESSION_MAX_PER_USER:0}

  # Client-certificate sign-in, on top of cert-alert.security.x509: revocation at sign-in,
  # the issuers accepted, mapping a certificate the directory does not publish, and
  # certificates forwarded by a TLS-terminating proxy. See the README's "A client
  # certificate" section.
  x509:
    # off, ocsp, crl or ocsp-then-crl. Unset is ocsp-then-crl, soft-fail: a certificate
    # found revoked is refused, and one nobody can answer for signs in with a warning.
    revocation: ${ENS_X509_REVOCATION:}
    ocsp-responder-url: ${ENS_X509_OCSP_RESPONDER_URL:}
    # CRL files (DER or PEM), re-read when they change; with it set nothing is fetched.
    crl-dir: ${ENS_X509_CRL_DIR:}
    # closed refuses a certificate whose status cannot be found; open allows it, warning.
    # Unset: open while ENS_X509_REVOCATION is unset too, closed once it is set.
    revocation-fail: ${ENS_X509_REVOCATION_FAIL:}
    revocation-cache: ${ENS_X509_REVOCATION_CACHE:10m}
    # Issuer DNs, separated by semicolons (a DN has commas of its own). Empty: any the
    # trust store accepts.
    allowed-issuers: ${ENS_X509_ALLOWED_ISSUERS:}
    # An LDAP filter with {upn}, {edipi}, {email} and {uuid}, for a certificate the directory
    # does not publish (only with require-known-certificate off).
    user-filter: ${ENS_X509_USER_FILTER:}
    # servlet (this application terminates TLS) or header (a proxy does, and forwards it).
    source: ${ENS_X509_SOURCE:servlet}
    header: ${ENS_X509_HEADER:X-SSL-Client-Cert}
    trusted-proxies: ${ENS_X509_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
    proxy-secret: ${ENS_X509_PROXY_SECRET:}
    proxy-secret-file: ${ENS_X509_PROXY_SECRET_FILE:}
    trusted-ca-file: ${ENS_X509_TRUSTED_CA_FILE:}

  consent-banner:
    enabled: ${ENS_CONSENT_BANNER_ENABLED:false}
    title: ${ENS_CONSENT_BANNER_TITLE:}
    text: ${ENS_CONSENT_BANNER_TEXT:}
    file: ${ENS_CONSENT_BANNER_FILE:}

  # The shared ENS audit trail (ens-audit/1): one JSON line per event, chained by SHA-256,
  # stored in the database and, optionally, sent on. Every product reads the same ENS_AUDIT_*
  # variables; see the README's "Audit logging" section.
  audit:
    # Each event as a raw JSON line on stdout (logger ens.audit, no prefix), for Docker's
    # logging driver or a Splunk Universal Forwarder.
    stdout: ${ENS_AUDIT_STDOUT:true}
    # A JSONL file, e.g. /var/log/ens/certalert/audit.jsonl, rotated daily or at 100 MB.
    file: ${ENS_AUDIT_FILE:}
    file-keep: ${ENS_AUDIT_FILE_KEEP:30}
    # 0 keeps everything. Above 0, events older than this many days are pruned daily once
    # every forwarding output has delivered them.
    retention-days: ${ENS_AUDIT_RETENTION_DAYS:0}
    splunk:
      url: ${ENS_AUDIT_SPLUNK_URL:}
      token: ${ENS_AUDIT_SPLUNK_TOKEN:}
      token-file: ${ENS_AUDIT_SPLUNK_TOKEN_FILE:}
      index: ${ENS_AUDIT_SPLUNK_INDEX:}
      sourcetype: ${ENS_AUDIT_SPLUNK_SOURCETYPE:ens:audit}
      insecure: ${ENS_AUDIT_SPLUNK_INSECURE:false}
    syslog:
      host: ${ENS_AUDIT_SYSLOG_HOST:}
      port: ${ENS_AUDIT_SYSLOG_PORT:}
      protocol: ${ENS_AUDIT_SYSLOG_PROTOCOL:tcp}
      facility: ${ENS_AUDIT_SYSLOG_FACILITY:local0}

logging:
  level:
    com.winllc.certalert: INFO
