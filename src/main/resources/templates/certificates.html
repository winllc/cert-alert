<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Certificates')}"></head>
<body>
<div th:replace="~{fragments/layout :: classificationBanner('top')}"></div>
<svg th:replace="~{fragments/icons :: sprite}"></svg>

<div class="page">
    <header th:replace="~{fragments/layout :: navbar('certificates')}"></header>

    <main class="page-wrapper" id="main-content" tabindex="-1">
        <div th:replace="~{fragments/layout :: pageheader('Certificates',
             'Every certificate the directory publishes, with who holds it - filter, save the view, export it')}"></div>

        <div class="page-body">
            <div class="container-xl">
                <div class="card mb-3">
                    <div class="card-body border-bottom">
                        <!--/* The same query string drives the table, the export links and a saved
                               view, so an export is exactly what is on screen, without the paging. */-->
                        <form id="certificate-filters" class="row g-3 align-items-end" aria-label="Certificate filters">
                            <div class="col-12 col-md-4">
                                <label class="form-label" for="f-q">Search</label>
                                <input type="search" id="f-q" name="q" class="form-control"
                                       placeholder="subject, issuer, serial, owner">
                            </div>
                            <fieldset class="col-12 col-md-auto">
                                <legend class="form-label">State</legend>
                                <div class="d-flex gap-3">
                                    <label class="form-check" for="f-status-valid">
                                        <input class="form-check-input" type="checkbox" id="f-status-valid" name="status" value="VALID">
                                        <span class="form-check-label">Valid</span>
                                    </label>
                                    <label class="form-check" for="f-status-expiring">
                                        <input class="form-check-input" type="checkbox" id="f-status-expiring" name="status" value="EXPIRING_SOON">
                                        <span class="form-check-label">Expiring soon</span>
                                    </label>
                                    <label class="form-check" for="f-status-expired">
                                        <input class="form-check-input" type="checkbox" id="f-status-expired" name="status" value="EXPIRED">
                                        <span class="form-check-label">Expired</span>
                                    </label>
                                </div>
                            </fieldset>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-owner">Held by</label>
                                <select id="f-owner" name="ownerType" class="form-select">
                                    <option value="">Anyone</option>
                                    <option value="USER">People</option>
                                    <option value="SERVER">Servers</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-within">Expiring within (days)</label>
                                <input type="number" id="f-within" name="expiresWithinDays" class="form-control" min="1" max="3650">
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="form-label" for="f-issuer">Issuer contains</label>
                                <input type="text" id="f-issuer" name="issuer" class="form-control">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-key">Key algorithm</label>
                                <select id="f-key" name="keyAlgorithm" class="form-select">
                                    <option value="">Any</option>
                                    <option>RSA</option>
                                    <option>EC</option>
                                    <option>Ed25519</option>
                                    <option>DSA</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-key-min">Key size at least (bits)</label>
                                <input type="number" id="f-key-min" name="keySizeMin" class="form-control" min="0">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-key-max">Key size at most (bits)</label>
                                <input type="number" id="f-key-max" name="keySizeMax" class="form-control" min="0">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-hash">Hash</label>
                                <select id="f-hash" name="hashAlgorithm" class="form-select">
                                    <option value="">Any</option>
                                    <option>SHA-256</option>
                                    <option>SHA-384</option>
                                    <option>SHA-512</option>
                                    <option>SHA-1</option>
                                    <option>MD5</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label" for="f-revocation">Revocation</label>
                                <select id="f-revocation" name="revocation" class="form-select">
                                    <option value="">Any</option>
                                    <option value="GOOD">Not revoked</option>
                                    <option value="REVOKED">Revoked</option>
                                    <option value="UNKNOWN">Unknown</option>
                                    <option value="NOT_CHECKED">Not checked</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2" th:if="${@licensing.shows('risky-names')}">
                                <label class="form-label" for="f-risk">Risky names</label>
                                <select id="f-risk" name="risk" class="form-select">
                                    <option value="">Any</option>
                                    <option value="any">Anything flagged</option>
                                    <option value="WILDCARD">Wildcard</option>
                                    <option value="BROAD_WILDCARD">Broad wildcard</option>
                                    <option value="MANY_NAMES">Many names</option>
                                    <option value="MANY_DOMAINS">Many domains</option>
                                    <option value="BARE_HOSTNAME">Bare hostname</option>
                                </select>
                            </div>
                            <div class="col-12 d-flex flex-wrap gap-2">
                                <button type="submit" class="btn btn-primary">Apply filters</button>
                                <button type="reset" class="btn">Clear</button>
                                <a class="btn ms-md-auto" id="export-csv" href="#" download>
                                    <svg class="icon me-1" aria-hidden="true"><use href="#icon-download"></use></svg>Export CSV
                                </a>
                                <a class="btn" id="export-xlsx" href="#" download>
                                    <svg class="icon me-1" aria-hidden="true"><use href="#icon-download"></use></svg>Export Excel
                                </a>
                            </div>
                        </form>
                    </div>

                    <!--/* Saved views: the filters above, kept under a name, for this person. */-->
                    <div class="card-body border-bottom">
                        <div class="row g-2 align-items-end">
                            <div class="col-12 col-md-4">
                                <label class="form-label" for="saved-views">Saved views</label>
                                <select id="saved-views" class="form-select">
                                    <option value="">Choose a saved view&hellip;</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn" id="saved-view-delete" disabled>Delete view</button>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="form-label" for="saved-view-name">Save these filters as</label>
                                <input type="text" id="saved-view-name" class="form-control" maxlength="120">
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn" id="saved-view-save">Save view</button>
                            </div>
                            <div class="col-12">
                                <span class="small text-secondary" id="saved-view-message" role="status"></span>
                            </div>
                        </div>
                    </div>

                    <div class="card-body border-bottom py-2 d-flex flex-wrap align-items-center gap-2">
                        <span id="certificate-count" class="text-secondary" role="status" aria-live="polite">Loading&hellip;</span>
                        <span class="ms-auto"></span>
                        <!--/* Bulk owner assignment, for the servers behind the rows picked. */-->
                        <form id="bulk-contact" class="d-flex flex-wrap gap-2 align-items-end" th:unless="${isAuditor and not isAdmin}">
                            <div>
                                <label class="form-label small mb-1" for="bulk-contact-email">Add a point of contact to the selected servers</label>
                                <input type="email" id="bulk-contact-email" class="form-control form-control-sm"
                                       placeholder="name@example.gov" maxlength="320" required>
                            </div>
                            <button type="submit" class="btn btn-sm" id="bulk-contact-submit" disabled>Add to selected</button>
                            <span class="small text-secondary align-self-center" id="bulk-contact-message" role="status"></span>
                        </form>
                    </div>

                    <div class="table-responsive">
                        <table class="table card-table table-vcenter" id="certificates">
                            <caption class="visually-hidden">Certificates matching the filters, one page at a time</caption>
                            <thead>
                            <tr>
                                <th scope="col" class="w-1">
                                    <input class="form-check-input" type="checkbox" id="select-all" aria-label="Select every server certificate on this page">
                                </th>
                                <th scope="col">Holder</th>
                                <th scope="col">Subject</th>
                                <th scope="col">Issuer</th>
                                <th scope="col" aria-sort="ascending" data-sort="notAfter">
                                    <button type="button" class="btn btn-link p-0 sort">Expires</button>
                                </th>
                                <th scope="col">State</th>
                                <th scope="col" data-sort="keyAlgorithm" aria-sort="none">
                                    <button type="button" class="btn btn-link p-0 sort">Key</button>
                                </th>
                                <th scope="col" data-sort="hashAlgorithm" aria-sort="none">
                                    <button type="button" class="btn btn-link p-0 sort">Hash</button>
                                </th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <nav class="card-footer d-flex align-items-center" aria-label="Pages of certificates">
                        <span class="text-secondary" id="certificate-page"></span>
                        <ul class="pagination m-0 ms-auto">
                            <li class="page-item"><button type="button" class="page-link" id="certificates-prev">Previous page</button></li>
                            <li class="page-item"><button type="button" class="page-link" id="certificates-next">Next page</button></li>
                        </ul>
                    </nav>
                </div>

                <!--/* Scheduled reports: administrators send a view by email; auditors can see them. */-->
                <section class="card mb-3" id="reports-card" th:if="${isAdmin or isAuditor}" aria-labelledby="reports-title">
                    <div class="card-header">
                        <h2 class="card-title" id="reports-title">Scheduled reports</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="table card-table table-vcenter" id="reports">
                            <caption class="visually-hidden">Scheduled reports</caption>
                            <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Recipients</th>
                                <th scope="col">Schedule (UTC)</th>
                                <th scope="col">Next</th>
                                <th scope="col">Last</th>
                                <th scope="col"><span class="visually-hidden">Actions</span></th>
                            </tr>
                            </thead>
                            <tbody aria-live="polite"></tbody>
                        </table>
                    </div>
                    <div class="card-body border-top" th:if="${isAdmin}">
                        <form id="report-form" class="row g-3 align-items-end">
                            <div class="col-12 col-md-3">
                                <label class="form-label" for="report-name">Name</label>
                                <input type="text" id="report-name" class="form-control" maxlength="120" required
                                       placeholder="Weekly expiring servers">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label" for="report-recipients">Recipients</label>
                                <input type="text" id="report-recipients" class="form-control" required
                                       placeholder="pki-team@example.gov, ops@example.gov">
                            </div>
                            <div class="col-6 col-md-auto">
                                <label class="form-label" for="report-format">Format</label>
                                <select id="report-format" class="form-select">
                                    <option value="xlsx">Excel</option>
                                    <option value="csv">CSV</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-auto">
                                <label class="form-label" for="report-frequency">Every</label>
                                <select id="report-frequency" class="form-select">
                                    <option value="DAILY">Day</option>
                                    <option value="WEEKLY" selected>Monday</option>
                                    <option value="MONTHLY">1st of the month</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-auto">
                                <label class="form-label" for="report-hour">At (UTC hour)</label>
                                <input type="number" id="report-hour" class="form-control" min="0" max="23" value="6">
                            </div>
                            <div class="col-12 col-md-auto">
                                <button type="submit" class="btn btn-primary">Schedule these filters</button>
                            </div>
                            <div class="col-12">
                                <span class="small text-secondary" id="report-message" role="status"></span>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/certificates.js}"></script>
<div th:replace="~{fragments/layout :: classificationBanner('bottom')}"></div>
</body>
</html>
