<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="'CertAlert · ' + ${pageTitle}">CertAlert</title>
    <!-- The mark on its own for the tab; like everything else here it ships in the jar. -->
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" type="image/png" th:href="@{/img/favicon-32.png}" sizes="32x32">
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
    <!-- The tables POST, so every request needs the CSRF token; the scripts read it here. -->
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <!-- Everything is served from the jar rather than a CDN: this runs on networks with no
         route to one. Tabler bundles the Bootstrap it is built on, so it comes first and
         DataTables' Bootstrap 5 integration layers on top. -->
    <link rel="stylesheet" th:href="@{/webjars/tabler__core/dist/css/tabler.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/datatables/css/dataTables.bootstrap5.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!--/*
      The classification banners, top and bottom.

      Drawn here, in the one fragment every page includes, rather than as elements a page
      has to remember to put in its body - there is no decorator layout in this project,
      only named fragments, and a head cannot hold body content. body::before and
      body::after reach every page from one place, and a page added tomorrow gets them
      without knowing they exist.

      The bean is resolved outside the style element because Thymeleaf will not evaluate a
      bean reference inside one, and it is right not to: what is written here is CSS and
      cannot be escaped on the way in. Which is why the colours and the height are checked
      against what a colour and a length may look like, and the text arrives already
      escaped as a CSS string. See BannerProperties.

      content: uses unescaped inlining for the same reason. The value is already a quoted
      CSS string, and escaped inlining would render its quotes as HTML entities, leaving a
      declaration the browser discards - a banner that silently does not appear.

      Kept terse below because unlike these, a CSS comment is served on every request.
    */-->
    <th:block th:with="banner=${@bannerProperties}">
    <style th:if="${banner.visible}" th:inline="text">
        body::before,
        body::after {
            content: [(${banner.cssText})];
            position: fixed;
            left: 0;
            right: 0;
            z-index: 1040;
            height: [[${banner.height}]];
            line-height: [[${banner.height}]];
            background: [[${banner.background}]];
            color: [[${banner.textColor}]];
            text-align: center;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            overflow: hidden;
            white-space: nowrap;
        }
        body::before { top: 0; }
        body::after { bottom: 0; }
        /* Room at both ends, so nothing sits underneath a bar. */
        body {
            padding-top: [[${banner.height}]];
            padding-bottom: [[${banner.height}]];
        }
        /* Fixed means the first page only, on paper. */
        @media print {
            body::before,
            body::after { position: static; }
            body { padding-top: 0; padding-bottom: 0; }
        }
    </style>
    </th:block>
</head>
<body>

<!--/* The application shell: brand, navigation, and who is signed in. */-->
<header th:fragment="navbar(active)" class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
    <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!--/* The reversed lockup: the bar is dark, so the navy of the full-colour one
               would disappear into it. */-->
        <a class="navbar-brand d-none-navbar-horizontal pe-0 pe-md-3" th:href="@{/users}">
            <img th:src="@{/img/logo-white.png}" alt="CertAlert" class="navbar-brand-image logo">
        </a>

        <div class="navbar-nav flex-row order-md-last">
            <!--/* What is waiting for whoever is signed in, and the way to the page about
                   it - there is no second link in the menu below, because a bell and a tab
                   going to the same place with the same icon is one of them too many.

                   Always rendered, which the badge inside it is not. It used to wait for
                   the count to come back before appearing, so that it never flashed a zero;
                   but the badge carries the number and hides itself when there is none, so
                   what that actually bought was a page unreachable until an AJAX call
                   returned, and unreachable at all when one failed. */-->
            <div class="nav-item me-2" id="notification-bell"
                 th:classappend="${active == 'notifications'} ? 'active'">
                <a class="nav-link px-2" th:href="@{/notifications}" title="Notifications"
                   aria-label="Notifications">
                    <svg class="icon"><use href="#icon-bell"></use></svg>
                    <span class="badge bg-red text-white d-none" id="notification-count">0</span>
                </a>
            </div>
            <div class="nav-item dropdown" th:if="${currentUser != null}">
                <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown" aria-label="Open account menu">
                    <span class="avatar avatar-sm bg-primary-lt"
                          th:text="${#strings.substring(currentUser.displayName, 0, 1)}">A</span>
                    <div class="d-none d-xl-block ps-2">
                        <div th:text="${currentUser.displayName}">Name</div>
                        <div class="mt-1 small text-secondary">
                            <span th:text="${isAdmin} ? 'Administrator' : 'Reader'">Reader</span>
                            &middot;
                            <span th:text="'via ' + ${currentUser.method}">via X509</span>
                        </div>
                    </div>
                </a>
                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                    <span class="dropdown-header" th:text="${currentUser.username}">username</span>
                    <div class="dropdown-item-text small text-secondary" th:if="${currentUser.directoryDn != null}"
                         th:text="${currentUser.directoryDn}">dn</div>
                    <div class="dropdown-divider"></div>
                    <form method="post" th:action="@{/logout}">
                        <button type="submit" class="dropdown-item">
                            <svg class="icon me-2"><use href="#icon-logout"></use></svg>
                            Sign out
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="collapse navbar-collapse" id="navbar-menu">
            <ul class="navbar-nav">
                <li class="nav-item" th:classappend="${active == 'users'} ? 'active'">
                    <a class="nav-link" th:href="@{/users}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg class="icon"><use href="#icon-users"></use></svg>
                        </span>
                        <span class="nav-link-title">People</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${active == 'servers'} ? 'active'">
                    <a class="nav-link" th:href="@{/servers}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg class="icon"><use href="#icon-server"></use></svg>
                        </span>
                        <span class="nav-link-title">Servers</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${active == 'projects'} ? 'active'">
                    <a class="nav-link" th:href="@{/projects}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg class="icon"><use href="#icon-folder"></use></svg>
                        </span>
                        <span class="nav-link-title">Projects</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${active == 'metrics'} ? 'active'">
                    <a class="nav-link" th:href="@{/metrics}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg class="icon"><use href="#icon-chart"></use></svg>
                        </span>
                        <span class="nav-link-title">Metrics</span>
                    </a>
                </li>
                <!--/* Administrators only: the page reads the whole audit trail. */-->
                <li class="nav-item" th:classappend="${active == 'admin'} ? 'active'" th:if="${isAdmin}">
                    <a class="nav-link" th:href="@{/admin}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg class="icon"><use href="#icon-shield-check"></use></svg>
                        </span>
                        <span class="nav-link-title">Admin</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>

<!--/* Page title, the run summary, and the sync control for administrators. */-->
<div th:fragment="pageheader(title, subtitle)" class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">IC Full Service Directory</div>
                <h2 class="page-title" th:text="${title}">Title</h2>
                <div class="text-secondary mt-1" th:text="${subtitle}">Subtitle</div>
            </div>
            <div class="col-auto ms-auto d-print-none">
                <div class="btn-list align-items-center">
                    <!-- Only appears when the changelog connector is enabled. -->
                    <span id="changelog-status" class="d-none"></span>
                    <span id="sync-status" class="text-secondary small"></span>
                    <button type="button" id="sync-now" class="btn btn-primary" th:if="${isAdmin}">
                        <svg class="icon"><use href="#icon-refresh"></use></svg>
                        Sync directory
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!--/* The certificate roll-up across whichever object type the page is showing. */-->
<div th:fragment="stats" class="row row-deck row-cards mb-3" id="stat-cards">
    <div class="col-6 col-sm-3">
        <div class="card card-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto"><span class="bg-blue-lt avatar"><svg class="icon"><use href="#icon-certificate"></use></svg></span></div>
                    <div class="col">
                        <div class="h3 mb-0" data-stat="total">&ndash;</div>
                        <div class="text-secondary">Total</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6 col-sm-3">
        <div class="card card-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto"><span class="bg-green-lt avatar"><svg class="icon"><use href="#icon-circle-check"></use></svg></span></div>
                    <div class="col">
                        <div class="h3 mb-0" data-stat="VALID">&ndash;</div>
                        <div class="text-secondary">Valid</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6 col-sm-3">
        <div class="card card-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto"><span class="bg-yellow-lt avatar"><svg class="icon"><use href="#icon-clock"></use></svg></span></div>
                    <div class="col">
                        <div class="h3 mb-0" data-stat="EXPIRING_SOON">&ndash;</div>
                        <div class="text-secondary">Expiring soon</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6 col-sm-3">
        <div class="card card-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto"><span class="bg-red-lt avatar"><svg class="icon"><use href="#icon-alert-triangle"></use></svg></span></div>
                    <div class="col">
                        <div class="h3 mb-0" data-stat="EXPIRED">&ndash;</div>
                        <div class="text-secondary">Expired</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts">
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/datatables/js/dataTables.js}"></script>
    <script th:src="@{/webjars/datatables/js/dataTables.bootstrap5.js}"></script>
    <script th:src="@{/webjars/tabler__core/dist/js/tabler.min.js}"></script>
    <script th:src="@{/js/directory-table.js}"></script>
    <script th:src="@{/js/sync.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</div>
</body>
</html>
