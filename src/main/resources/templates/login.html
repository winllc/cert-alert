<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="d-flex flex-column bg-surface-secondary">
<div th:replace="~{fragments/layout :: banners}"></div>
<svg th:replace="~{fragments/icons :: sprite}"></svg>

<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <img th:src="@{/img/logo.png}" alt="CertAlert" class="logo logo-lg">
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="h3 text-center mb-3">Sign in</h2>

                <div class="alert alert-info" role="alert">
                    <div class="d-flex">
                        <div><svg class="icon alert-icon"><use href="#icon-key"></use></svg></div>
                        <div>
                            No client certificate was accepted. Presenting one the directory publishes
                            signs you in without this form.
                        </div>
                    </div>
                </div>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    That username and password were not accepted by the directory.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    You have been signed out.
                </div>

                <form method="post" th:action="@{/login}" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="your directory username" autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="your directory password" autocomplete="current-password" required>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">
                            <svg class="icon me-1"><use href="#icon-lock"></use></svg>
                            Sign in
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-secondary small">
                Your password is checked by binding to the directory. It is never stored here.
            </div>
        </div>
    </div>
</div>
</body>
</html>
