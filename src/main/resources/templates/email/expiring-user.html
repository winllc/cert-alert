<!DOCTYPE html>
<!--/*
  Somebody's own certificates, expiring or expired.

  The person reading this is the one the certificate was issued to, so it is written in the
  second person and it asks them to renew. Model: a single "digest" (see ExpiryDigest).
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${digest.headline}">Your certificates are expiring</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f5f7f9;
             font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
             color:#1a2530;">

<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
    <tr>
        <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" width="640"
                   style="width:100%;max-width:640px;border-collapse:collapse;background:#ffffff;
                          border:1px solid #e3e7eb;border-radius:6px;">
                <tr>
                    <td style="padding:0;">
                        <div th:replace="~{email/fragments :: header('Your certificates', ${digest})}"></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 24px 4px 24px;font-size:14px;line-height:1.55;">
                        <p style="margin:0 0 12px 0;"
                           th:text="${digest.recipientName} != null ? 'Hello ' + ${digest.recipientName} + ',' : 'Hello,'">
                            Hello Alice Archer,
                        </p>
                        <p style="margin:0 0 4px 0;">
                            The directory publishes these certificates against your entry. Renew them and publish
                            the new certificate, and they will drop off this list.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:12px 14px 4px 14px;">
                        <div th:replace="~{email/fragments :: certificates(${digest.entries}, 'Issued to')}"></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0;">
                        <div th:replace="~{email/fragments :: footer('these certificates were issued to you')}"></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
