<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('People')}"></head>
<body>
<svg th:replace="~{fragments/icons :: sprite}"></svg>

<div class="page">
    <header th:replace="~{fragments/layout :: navbar('users')}"></header>

    <div class="page-wrapper">
        <div th:replace="~{fragments/layout :: pageheader('People', 'IC Persons and the certificates they publish')}"></div>

        <div class="page-body">
            <div class="container-xl">
                <div th:replace="~{fragments/layout :: stats}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-auto">
                        <label class="form-label" for="cert-state">Certificates</label>
                        <select id="cert-state" class="form-select">
                            <option value="">Any</option>
                            <option value="expired">Has an expired certificate</option>
                            <option value="not-expired">No expired certificate</option>
                            <option value="expiring-soon">Expiring soon</option>
                            <option value="valid">Valid only</option>
                            <option value="none">Holds no certificate</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-auto">
                        <!--/* Lapsed entries are hidden unless asked for: they are what has already
                               gone wrong, not what is about to. */-->
                        <label class="form-check form-switch mb-2">
                            <input type="checkbox" id="show-expired" class="form-check-input">
                            <span class="form-check-label">Show expired</span>
                        </label>
                    </div>
                    <div class="col-12 col-md-auto">
                        <label class="form-label" for="within-days">Expiring within</label>
                        <div class="input-group">
                            <input type="number" id="within-days" class="form-control" min="1" max="3650"
                                   placeholder="any" style="max-width: 7rem">
                            <span class="input-group-text">days</span>
                        </div>
                    </div>
                    <div class="col-12 col-md-auto">
                        <!--/* The day the last of an entry's certificates runs out: what is
                               gone by the end of the quarter, rather than what expires next. */-->
                        <label class="form-label" for="latest-from">Last certificate expires</label>
                        <div class="input-group" style="max-width: 20rem;">
                            <input type="date" id="latest-from" class="form-control" aria-label="from">
                            <span class="input-group-text">to</span>
                            <input type="date" id="latest-to" class="form-control" aria-label="to">
                        </div>
                    </div>
                    <div class="col-12 col-md-auto">
                        <!--/* A serverPOC names a person by an address or a form of their name,
                               and not always one this table shows: match every one of them. */-->
                        <label class="form-label" for="poc-name">Point of contact name</label>
                        <input type="text" id="poc-name" class="form-control"
                               placeholder="name or address from a serverPOC">
                    </div>
                    <div class="col-12 col-md-auto">
                        <!--/* A certificate is risky for what it is good for, not for what
                               state it is in: one key for a whole domain, or for forty
                               things, or for a name that means something different on
                               every network. */-->
                        <label class="form-label" for="risk-filter">Risky names</label>
                        <select id="risk-filter" class="form-select">
                            <option value="">Any</option>
                            <option value="any">Anything flagged</option>
                            <option value="WILDCARD">Wildcard</option>
                            <option value="BROAD_WILDCARD">Broad wildcard</option>
                            <option value="MANY_NAMES">Many names</option>
                            <option value="MANY_DOMAINS">Many domains</option>
                            <option value="BARE_HOSTNAME">Bare hostname</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-auto">
                        <label class="form-label" for="project-filter">Project</label>
                        <select id="project-filter" class="form-select">
                            <option value="">Any</option>
                        </select>
                    </div>
                            <div class="col d-flex justify-content-md-end align-items-center">
                                <span id="applied-filters" class="text-secondary small"></span>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table id="users-table" class="table card-table table-vcenter text-nowrap datatable"
                               style="width:100%">
                            <thead>
                            <tr>
                            <th></th>
                            <th>Name</th>
                            <th>UID</th>
                            <th>Email</th>
                            <th>Title</th>
                            <th>Employee type</th>
                            <th>Duty organization</th>
                            <th>Country</th>
                            <th>Certs</th>
                            <th>Status</th>
                            <th>Expires</th>
                            <th>Last expires</th>
                            <th>Last synced</th>
                            <th>DN</th>
                            </tr>
                            </thead>
                            <tfoot>
                            <tr class="column-search">
                            <th></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Name"></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="UID"></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Email"></th>
                            <th></th>
                            <th></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Duty organization"></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer footer-transparent d-print-none">
            <div class="container-xl">
                <div class="row text-center align-items-center flex-row-reverse">
                    <div class="col-12 col-lg-auto mt-3 mt-lg-0">
                        <span class="text-secondary">
                            Cached from the IC Full Service Directory. Expiry is evaluated from the cached
                            certificate, not re-read from the directory on every view.
                        </span>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/audit-trail.js}"></script>
<script th:src="@{/js/project-filter.js}"></script>
<script th:src="@{/js/users-table.js}"></script>
</body>
</html>
