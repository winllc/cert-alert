<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servers')}"></head>
<body>
<header th:replace="~{fragments/layout :: appbar('servers')}"></header>

<main>
    <section class="filters">
        <div class="field">
            <label for="cert-state">Certificates</label>
            <select id="cert-state">
                <option value="">Any</option>
                <option value="expired">Has an expired certificate</option>
                <option value="not-expired">No expired certificate</option>
                <option value="expiring-soon">Expiring soon</option>
                <option value="valid">Valid only</option>
                <option value="none">Holds no certificate</option>
            </select>
        </div>
        <div class="field">
            <label for="within-days">Expiring within (days)</label>
            <input type="number" id="within-days" min="1" max="3650" placeholder="any">
        </div>
        <div class="field">
            <!-- The FSD schema defines serverPOC as the NAME of the responsible person or
                 organization; directories often hold an address instead. Either matches. -->
            <label for="poc-email">Point of contact (serverPOC)</label>
            <input type="text" id="poc-email" placeholder="name or address">
        </div>
        <div class="field" id="poc-user-field" hidden>
            <label>Responsible for</label>
            <span class="chip">
                <span id="poc-user-label"></span>
                <button type="button" id="poc-user-clear" title="Clear">x</button>
            </span>
        </div>
        <div class="applied" id="applied-filters"></div>
    </section>

    <section class="table-panel">
        <table id="servers-table" class="directory display" style="width:100%">
            <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>URL</th>
                <th>IP address</th>
                <th>Points of contact</th>
                <th>Lifecycle</th>
                <th>ATO</th>
                <th>Duty organization</th>
                <th>Certs</th>
                <th>Status</th>
                <th>Expires</th>
                <th>Last synced</th>
                <th>DN</th>
            </tr>
            </thead>
            <tfoot>
            <tr>
                <th></th>
                <th><input type="text" placeholder="Name"></th>
                <th><input type="text" placeholder="URL"></th>
                <th><input type="text" placeholder="IP address"></th>
                <th><input type="text" placeholder="Contact"></th>
                <th><input type="text" placeholder="Lifecycle"></th>
                <th><input type="text" placeholder="ATO"></th>
                <th><input type="text" placeholder="Duty organization"></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th><input type="text" placeholder="DN"></th>
            </tr>
            </tfoot>
        </table>
    </section>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/servers-table.js}"></script>
</body>
</html>
