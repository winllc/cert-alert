# Local development: in-memory database, verbose logging, H2 console, frequent scans.
spring:
  datasource:
    url: jdbc:h2:mem:cert-alert;DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

cert-alert:
  scan-cron: "0 */5 * * * *"

logging:
  level:
    com.winllc.certalert: DEBUG
    org.hibernate.SQL: DEBUG
