# A demo: a running copy anybody can look at and nobody can change.
#
#   ./gradlew bootRun --args='--spring.profiles.active=demo'
#
# Stands on its own, and needs nothing else to be running. It generates a directory of
# invented people and servers, serves it from memory over LDAP, and then indexes it the
# way it would index anyone's - so what a visitor is shown is the application working,
# not a mock-up of it.
#
# What this profile does NOT do is make it safe to point at real data. Every visitor gets
# the administrator's view of the whole directory with no sign-in at all. That is a
# reasonable thing to do with invented entries, on an instance you can throw away, and
# never with somebody's real directory.

# Plain HTTP, whatever the environment says. TLS is here to carry X.509 client
# certificates, and a demo has no use for them: nobody signs in, so there is nothing for a
# certificate to authenticate. It also needs a keystore, which a demo does not carry and
# must never have baked into it - so a demo started where CERT_ALERT_TLS_ENABLED happens to
# be set would fail to start for want of one, rather than doing anything useful with it.
#
# Pinned here rather than left to the default in application.yml, which reads that variable.
# Deliberately putting a demo behind TLS is still possible - SERVER_SSL_ENABLED=true, or
# --server.ssl.enabled=true, both of which outrank a profile - but it is no longer something
# that happens to a demo because of the environment it was started in.
server:
  ssl:
    enabled: false

spring:
  # In memory, and gone with the process. A demo that kept its cache in a file would come
  # back tomorrow still holding yesterday's expiry dates, while the directory beside it
  # had been generated fresh - the tables and the entries they came from disagreeing is a
  # worse first impression than a few seconds of sweeping at startup.
  datasource:
    url: jdbc:h2:mem:cert-alert-demo;DB_CLOSE_DELAY=-1

  # Where the demo's own directory listens. One setting, read by both sides: the
  # application connects here and DemoDirectoryServer binds whatever port it names.
  ldap:
    urls: ldap://localhost:18390
    base: dc=example,dc=test
    username: ""
    password: ""

cert-alert:
  demo:
    enabled: true
    # The password every generated account carries, printed on the sign-in page beside the
    # accounts it opens. Not a credential: the people are invented and the directory
    # holding them goes with the process.
    password: password
    # Enough to page and filter; small enough to be serving pages seconds after starting.
    people: 24
    servers: 16

  security:
    # Only the administrator account. The other three on the sign-in page are deliberately
    # not here: an administrator who was the only account anybody could be would make the
    # roles the sign-in page offers indistinguishable.
    admin-identifiers: [demo.admin@intelink.ic.gov]
    ldap:
      # A demo signs people in by binding to its own directory, exactly as a deployment
      # binds to a real one. The generated entries are all under ou=people and are found
      # by uid, which is what the sign-in page prints.
      user-search-base: ou=people
      user-search-filter: "(uid={0})"

  # Nothing that reaches out of this process. Read-only is enforced on every request, so a
  # visitor cannot start any of these - but the schedules would run them unasked, and a
  # demo that emails real people or deletes certificates out of a directory is not a demo.
  notifications:
    email:
      # Off, so nothing reaches anybody's inbox. That is the setting that stops mail.
      enabled: false
      # And deliberately NOT dry-run. A rehearsal is defined to write nothing down, so a
      # demo that left it on would gather the round-up, report what it would have sent,
      # and then discard it - leaving the notifications page empty beside tables full of
      # things expiring this week. The Dry run button still rehearses on demand.
      dry-run: false
  ldap:
    user:
      search-base: ou=people
    server:
      search-base: ou=servers
      # The generated directory writes serverPOC both ways round - as an address and as a
      # person's name - because the specification defines it as a name and real
      # directories do both. Keeping the names is the point, so this reads it that way.
      require-email-poc: false
    prune:
      enabled: false
    certificate-cleanup:
      enabled: false
    # Left on: the sweep is what fills the tables, and it only writes to this application's
    # own cache. Every certificate it reads was invented by the generator.
    sync:
      enabled: true
  revocation:
    # Left on, so the administration page's revocation card is live rather than greyed out
    # saying it is switched off - a demo of an administration page wants its controls to be
    # the ones a deployment has. It reaches nowhere: the sample's certificates name no
    # distribution point and no responder, and neither default is set here, so the check
    # asks nobody anything. Do not set those defaults on a demo.
    enabled: true
