apiVersion: v2
name: cert-alert
description: >-
  CertAlert - reads the certificates an LDAP directory publishes and tells the right people
  before they expire. Spring Boot application with PostgreSQL (external, or an embedded
  evaluation-only instance).
type: application
# Both are set from the release tag when CI packages the chart
