# Every secret from Secrets created outside the chart, a license Secret, a private-CA trust
# store for ldaps://, an existing license PVC, mTLS passthrough through ingress-nginx, and an
# air-gapped registry mirror.
global:
  imageRegistry: registry.example.gov
imagePullSecrets:
  - name: mirror-pull
ldap:
  url: ldaps://directory.example.gov:636
  base: dc=example,dc=gov
  bindDn: cn=cert-alert,ou=services,dc=example,dc=gov
  existingSecret: cert-alert-secrets
  existingSecretKey: ldap-password
database:
  host: postgres.db.svc
  existingSecret: cert-alert-secrets
  existingSecretKey: db-password
mail:
  host: smtp.example.gov
  existingSecret: cert-alert-secrets
  existingSecretKey: mail-password
security:
  adminIdentifiers: [pki-admin]
tls:
  enabled: true
  keystore:
    existingSecret: cert-alert-tls-stores
    passwordExistingSecret: cert-alert-secrets
  truststore:
    existingSecret: cert-alert-tls-stores
    passwordExistingSecret: cert-alert-secrets
caTruststore:
  existingSecret: cert-alert-tls-stores
  passwordExistingSecret: cert-alert-secrets
audit:
  splunk:
    url: https://splunk.example.gov:8088
    existingSecret: cert-alert-secrets
license:
  existingSecret: cert-alert-license
persistence:
  license:
    existingClaim: cert-alert-license-kept
service:
  type: LoadBalancer
  externalTrafficPolicy: Local
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  hosts:
    - host: cert-alert.example.gov
      paths:
        - path: /
          pathType: Prefix
webhooks:
  existingSecret: cert-alert-secrets
  existingSecretKey: webhooks-secret-key
