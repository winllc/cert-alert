apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-alert.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (has .Values.service.type (list "LoadBalancer" "NodePort")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    # HTTP, or HTTPS with tls.enabled (TLS terminates in the pod, so client certificates
    # reach the application).
    - name: {{ include "cert-alert.scheme" . }}
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (has .Values.service.type (list "LoadBalancer" "NodePort")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    # The actuator, for Prometheus. The ingress and route never send traffic here.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "cert-alert.selectorLabels" . | nindent 4 }}
