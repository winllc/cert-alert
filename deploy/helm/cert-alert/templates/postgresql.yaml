{{- if .Values.database.embedded.enabled -}}
{{- $db := .Values.database.embedded -}}
# EVALUATION ONLY, NO BACKUPS: a single PostgreSQL pod with a PVC, of the image the release
# bundle ships. Use an external, managed PostgreSQL for anything you need to keep.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-alert.db.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.db.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.database.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "cert-alert.db.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-alert.db.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.db.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: {{ .Values.database.port }}
      targetPort: postgresql
  selector:
    {{- include "cert-alert.db.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cert-alert.db.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.db.labels" . | nindent 4 }}
  annotations:
    ens.winllc.com/support: "evaluation only, no backups"
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  serviceName: {{ include "cert-alert.db.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "cert-alert.db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cert-alert.db.labels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cert-alert.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "cert-alert.securityContext" (dict "ctx" $db.podSecurityContext "root" .) | nindent 8 }}
      containers:
        - name: postgresql
          image: {{ include "cert-alert.dbImage" . }}
          imagePullPolicy: {{ $db.image.pullPolicy }}
          securityContext:
            {{- include "cert-alert.securityContext" (dict "ctx" $db.containerSecurityContext "root" .) | nindent 12 }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.username | quote }}
            # Read once, when the volume is first initialised. Changing it afterwards means
            # ALTER ROLE in the database as well.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- $ref := fromJson (include "cert-alert.db.passwordRef" .) }}
                  name: {{ $ref.name }}
                  key: {{ $ref.key }}
            # A subdirectory, so the volume's lost+found does not stop initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with $db.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $db.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $db.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cert-alert.db.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $db.persistence.accessModes | nindent 10 }}
        {{- with $db.persistence.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ $db.persistence.size }}
{{- end }}
