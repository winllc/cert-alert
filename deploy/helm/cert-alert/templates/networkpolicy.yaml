{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cert-alert.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cert-alert.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with $np.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and .Values.metrics.enabled .Values.metrics.allowFrom }}
    # The metrics port, from Prometheus only.
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      from:
        {{- toYaml .Values.metrics.allowFrom | nindent 8 }}
    {{- end }}
  egress:
    {{- if $np.egress.allowAll }}
    - {}
    {{- else }}
    {{- if $np.egress.dns }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    # The database.
    - ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
      to:
        {{- if .Values.database.embedded.enabled }}
        - podSelector:
            matchLabels:
              {{- include "cert-alert.db.selectorLabels" . | nindent 14 }}
        {{- else }}
        {{- range $np.egress.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
    {{- range $name, $rule := dict "ldap" $np.egress.ldap "smtp" $np.egress.smtp "web" $np.egress.web }}
    # {{ $name }}
    - ports:
        {{- range $rule.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
        {{- if eq $name "web" }}
        - port: 514
          protocol: UDP
        {{- end }}
      to:
        {{- range $rule.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- if .Values.database.embedded.enabled }}
---
# The embedded database: reachable from cert-alert (and its pre-upgrade backup) only, and
# reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cert-alert.db.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cert-alert.db.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cert-alert.selectorLabels" . | nindent 14 }}
        {{- if .Values.upgradeBackup.enabled }}
        # The pre-upgrade backup's pg_dump.
        - podSelector:
            matchLabels:
              {{- include "cert-alert.backup.selectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
  egress: []
{{- end }}
{{- end }}
