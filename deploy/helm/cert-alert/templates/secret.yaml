{{- $v := .Values -}}
{{- $data := dict -}}
{{- if and (not $v.database.existingSecret) (or $v.database.password $v.database.embedded.enabled) -}}
{{- $_ := set $data "db-password" (include "cert-alert.db.password" .) -}}
{{- end -}}
{{- if and (not $v.ldap.existingSecret) $v.ldap.bindPassword -}}
{{- $_ := set $data "ldap-password" $v.ldap.bindPassword -}}
{{- end -}}
{{- if and (not $v.mail.existingSecret) $v.mail.password -}}
{{- $_ := set $data "mail-password" $v.mail.password -}}
{{- end -}}
{{- if and (not $v.tls.keystore.passwordExistingSecret) $v.tls.keystore.password -}}
{{- $_ := set $data "keystore-password" $v.tls.keystore.password -}}
{{- end -}}
{{- if and (not $v.tls.truststore.passwordExistingSecret) $v.tls.truststore.password -}}
{{- $_ := set $data "truststore-password" $v.tls.truststore.password -}}
{{- end -}}
{{- if and (not $v.caTruststore.passwordExistingSecret) $v.caTruststore.password -}}
{{- $_ := set $data "ca-truststore-password" $v.caTruststore.password -}}
{{- end -}}
{{- if and (not $v.x509.proxySecret.existingSecret) $v.x509.proxySecret.value -}}
{{- $_ := set $data "x509-proxy-secret" $v.x509.proxySecret.value -}}
{{- end -}}
{{- if and (not $v.x509.trustedCa.existingSecret) $v.x509.trustedCa.value -}}
{{- $_ := set $data "x509-ca.pem" $v.x509.trustedCa.value -}}
{{- end -}}
{{- if and $v.sso.oidc.enabled (not $v.sso.oidc.existingSecret) $v.sso.oidc.clientSecret -}}
{{- $_ := set $data "oidc-client-secret" $v.sso.oidc.clientSecret -}}
{{- end -}}
{{- if and (not $v.audit.splunk.existingSecret) $v.audit.splunk.token -}}
{{- $_ := set $data "splunk-hec-token" $v.audit.splunk.token -}}
{{- end -}}
{{- if and (not $v.webhooks.existingSecret) $v.webhooks.secretKey -}}
{{- $_ := set $data "webhooks-secret-key" $v.webhooks.secretKey -}}
{{- end -}}
{{- if $data }}
# Secret values given inline in the chart's values. Each can come from a Secret of your own
# instead (<value>.existingSecret), and then nothing is written here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cert-alert.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $val := $data }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if .Values.license.file }}
---
# The license given with --set-file license.file=./license.lic. The init container copies it
# into the license volume only when no license is installed there yet.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cert-alert.licenseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-alert.labels" . | nindent 4 }}
type: Opaque
data:
  license.lic: {{ .Values.license.file | b64enc | quote }}
{{- end }}
