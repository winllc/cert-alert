# cert-alert - production deployment, with Docker Compose v2 or with Podman (podman-compose
# 1.3.0 or later).
#
# Two services: the application and its PostgreSQL. The LDAP directory it scrapes and the
# mail server it sends through are your own, outside this file, and configured in .env.
#
#   ./install.sh                  first install
#   ./upgrade.sh --from <old dir> moving to a new release
#   docker compose ps | logs -f | down     day to day (`down -v` also deletes the database);
#   podman-compose ps | logs -f | down     the same with Podman
#
# The image names below are fully qualified (Podman has no default registry) and are the
# exact ones this release was tested and published with; the images themselves ship in
# images/ so nothing here needs a registry. Settings go in .env
# (made from env.template by install.sh), not in this file, so an upgrade can replace this
# file without losing anything of yours.

# Fixed, so the database and license volumes are the same ones whichever directory a release
# is unpacked into - an upgrade unpacks next to the old release and finds its data and its
# license. Override with COMPOSE_PROJECT_NAME in .env to run a second instance on one host.
name: cert-alert

services:
  postgres:
    image: @POSTGRES_IMAGE@
    environment:
      POSTGRES_DB: ${CERT_ALERT_DB_NAME:-certalert}
      POSTGRES_USER: ${CERT_ALERT_DB_USER:-certalert}
      # Read once, when the volume is first initialised. Changing it afterwards means
      # changing it in the database too (ALTER ROLE), not only here.
      POSTGRES_PASSWORD: ${CERT_ALERT_DB_PASSWORD:?set CERT_ALERT_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # Only on the internal network: nothing outside this file reaches the database, and it
    # reaches nothing outside either.
    networks: [backend]
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cert-alert:
    image: @CERT_ALERT_IMAGE@
    depends_on:
      postgres:
        condition: service_healthy
    # Everything set in .env reaches the application, so any setting from the
    # documentation can be added there as its environment variable (cert-alert.ldap.page-size
    # is CERT_ALERT_LDAP_PAGE_SIZE) without editing this file. A setting left commented out in
    # .env is not passed at all, and the application's default applies.
    env_file: .env
    # The ones this file decides, and the ones a deployment cannot start without.
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      CERT_ALERT_DB_URL: jdbc:postgresql://postgres:5432/${CERT_ALERT_DB_NAME:-certalert}
      CERT_ALERT_DB_USER: ${CERT_ALERT_DB_USER:-certalert}
      CERT_ALERT_DB_PASSWORD: ${CERT_ALERT_DB_PASSWORD:?set CERT_ALERT_DB_PASSWORD in .env}
      CERT_ALERT_LDAP_URL: ${CERT_ALERT_LDAP_URL:?set CERT_ALERT_LDAP_URL in .env}
      CERT_ALERT_LDAP_BASE: ${CERT_ALERT_LDAP_BASE:?set CERT_ALERT_LDAP_BASE in .env}
      # The audit trail (ens-audit/1): every ENS_AUDIT_* setting, passed through. Unset
      # means the application's default; see env.template and the README.
      ENS_AUDIT_STDOUT: ${ENS_AUDIT_STDOUT:-true}
      ENS_AUDIT_FILE: ${ENS_AUDIT_FILE:-}
      ENS_AUDIT_FILE_KEEP: ${ENS_AUDIT_FILE_KEEP:-30}
      ENS_AUDIT_RETENTION_DAYS: ${ENS_AUDIT_RETENTION_DAYS:-0}
      ENS_AUDIT_SPLUNK_URL: ${ENS_AUDIT_SPLUNK_URL:-}
      ENS_AUDIT_SPLUNK_TOKEN: ${ENS_AUDIT_SPLUNK_TOKEN:-}
      ENS_AUDIT_SPLUNK_TOKEN_FILE: ${ENS_AUDIT_SPLUNK_TOKEN_FILE:-}
      ENS_AUDIT_SPLUNK_INDEX: ${ENS_AUDIT_SPLUNK_INDEX:-}
      ENS_AUDIT_SPLUNK_SOURCETYPE: ${ENS_AUDIT_SPLUNK_SOURCETYPE:-ens:audit}
      ENS_AUDIT_SPLUNK_INSECURE: ${ENS_AUDIT_SPLUNK_INSECURE:-false}
      ENS_AUDIT_SYSLOG_HOST: ${ENS_AUDIT_SYSLOG_HOST:-}
      ENS_AUDIT_SYSLOG_PORT: ${ENS_AUDIT_SYSLOG_PORT:-}
      ENS_AUDIT_SYSLOG_PROTOCOL: ${ENS_AUDIT_SYSLOG_PROTOCOL:-tcp}
      ENS_AUDIT_SYSLOG_FACILITY: ${ENS_AUDIT_SYSLOG_FACILITY:-local0}
    ports:
      # 8080 inside whichever way it is served: plain HTTP, or HTTPS once
      # CERT_ALERT_TLS_ENABLED=true. Only the host side moves. Every interface by default;
      # CERT_ALERT_BIND_ADDRESS=127.0.0.1 keeps it to this host, for a TLS-terminating
      # reverse proxy in front. With TLS off on any other address install.sh warns that it
      # is reachable over plain HTTP. An upgrade keeps the address and port in .env. The
      # host port stays 1024 or above for rootless Podman. Not published at all, for a proxy
      # on the compose network: copy docker-compose.no-ports.yml to docker-compose.override.yml.
      - "${CERT_ALERT_BIND_ADDRESS:-0.0.0.0}:${CERT_ALERT_PORT:-8080}:8080"
    volumes:
      # The ENS license, this installation's id and the license revisions seen of releases
      # that kept them in files. They are now in the database: the first start of this release
      # imports them from here, and the volume is not read after that. install.sh gives
      # license/license.lic as ENS_LICENSE in .env instead. The image sets ENS_LICENSE_FILE and
      # ENS_LICENSE_STATE_DIR to point here.
      - ens-license:/var/lib/ens/certalert
      # The audit trail's JSONL file, when ENS_AUDIT_FILE points under /var/log/ens (e.g.
      # /var/log/ens/certalert/audit.jsonl). A named volume, writable by the runtime user
      # (uid 185, group 0 rwx for OpenShift), so a Splunk forwarder can mount it too.
      - ens-audit:/var/log/ens
      # Keystore and truststore for TLS / X.509 client certificates, when enabled in .env.
      # Empty is fine while TLS is off. Z relabels them for SELinux (RHEL, Fedora), and is
      # ignored where SELinux is off. Readable by the container's uid 185: see the README
      # for rootless Podman.
      - ./tls:/etc/cert-alert/tls:ro,Z
      # Email templates of your own, used only when
      # CERT_ALERT_NOTIFICATIONS_EMAIL_TEMPLATE_DIRECTORY=/etc/cert-alert/templates is set.
      - ./email-templates:/etc/cert-alert/templates:ro,Z
    healthcheck:
      # Liveness rather than the aggregate: the aggregate turns DOWN when the directory is
      # unreachable, which is not a reason to call a process serving cached data unhealthy.
      # /livez, which stays on 8080 even when MANAGEMENT_SERVER_PORT moves the actuator.
      # Plain HTTP first, then HTTPS for when TLS is on (self-signed is fine for this).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/livez || curl -fsSk https://localhost:8080/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # backend for the database; default for everything outside - the directory, the mail
    # server, CRL and OCSP responders, and the published port.
    networks: [default, backend]
    restart: unless-stopped
    logging: *logging

networks:
  default:
  backend:
    internal: true

volumes:
  postgres-data:
  # Never removed by install.sh or upgrade.sh. `docker compose down -v` deletes it - and
  # with it the installation id, so a license bound to this installation would have to be
  # re-bound on the ENS portal.
  ens-license:
  # The audit file output, when ENS_AUDIT_FILE is set. The database holds the trail
  # regardless; this is a copy for a forwarder to tail.
  ens-audit:
