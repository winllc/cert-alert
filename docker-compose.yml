# A Postgres-backed run of cert-alert with a directory to scrape, for trying the image out.
#
#   docker compose up --build
#
# Three services: PostgreSQL, a stand-in 389 Directory Server loaded with generated people
# and servers, and the application. Everything has a default password and the directory
# serves plaintext LDAP; this is a demo, not a deployment.
#
# The directory publishes cn=changelog, so the changelog connector can be tried here:
# set CERT_ALERT_LDAP_CHANGELOG_ENABLED=true in the application's environment.
#
# Sign in at http://localhost:8080 as alice / password, then press Sync directory.
#
# To point it at a real directory instead, override the CERT_ALERT_LDAP_* variables - the
# stand-in keeps running but nothing reads it:
#
#   CERT_ALERT_LDAP_URL=ldaps://directory.example.gov:636 \
#   CERT_ALERT_LDAP_BASE=dc=example,dc=gov \
#   CERT_ALERT_LDAP_USER='cn=cert-alert,ou=services,dc=example,dc=gov' \
#   CERT_ALERT_LDAP_PASSWORD=... \
#   docker compose up --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: certalert
      POSTGRES_USER: certalert
      POSTGRES_PASSWORD: ${CERT_ALERT_DB_PASSWORD:-certalert}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The application waits for this rather than crash-looping on an empty database.
      test: ["CMD-SHELL", "pg_isready -U certalert -d certalert"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  directory:
    build:
      context: .
      dockerfile: docker/389ds/Dockerfile
    environment:
      # dscontainer's own, read when it creates the instance.
      DS_DM_PASSWORD: ${CERT_ALERT_LDAP_ADMIN_PASSWORD:-directory-manager}
      DS_SUFFIX_NAME: ${CERT_ALERT_LDAP_BASE:-dc=example,dc=test}
      LDAP_SERVICE_PASSWORD: ${CERT_ALERT_LDAP_PASSWORD:-cert-alert}
      # How much dummy data to generate the first time the volume is empty. Raise these to
      # see the tables and the paged sweep under load; 100k is the case this was built for,
      # though minting that many certificates takes a while - see the generator's
      # --no-certificates.
      LDAP_DUMMY_USERS: ${CERT_ALERT_DUMMY_USERS:-100}
      LDAP_DUMMY_SERVERS: ${CERT_ALERT_DUMMY_SERVERS:-40}
    volumes:
      # Everything the directory has - configuration, database, schema - lives here, which
      # is what makes resetting it `docker compose down -v` and nothing else.
      - ldap-data:/data
      # Mount a directory of your own here to load it instead of generating one; the files
      # are loaded in name order.
      # - ./my-directory:/bootstrap:ro
    ports:
      # Exposed so you can point ldapsearch at it; the application reaches it over the
      # compose network and does not need this.
      - "1389:3389"
    restart: unless-stopped

  cert-alert:
    build:
      context: .
      args:
        REVISION: ${GIT_REVISION:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      directory:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      CERT_ALERT_DB_URL: jdbc:postgresql://postgres:5432/certalert
      CERT_ALERT_DB_USER: certalert
      CERT_ALERT_DB_PASSWORD: ${CERT_ALERT_DB_PASSWORD:-certalert}
      CERT_ALERT_LDAP_URL: ${CERT_ALERT_LDAP_URL:-ldap://directory:3389}
      CERT_ALERT_LDAP_BASE: ${CERT_ALERT_LDAP_BASE:-dc=example,dc=test}
      CERT_ALERT_LDAP_USER: ${CERT_ALERT_LDAP_USER:-cn=cert-alert,ou=services,dc=example,dc=test}
      CERT_ALERT_LDAP_PASSWORD: ${CERT_ALERT_LDAP_PASSWORD:-cert-alert}
      # Where the password fallback looks a person up. The stand-in keeps them in one
      # place; a real directory may want this empty, to search the whole tree.
      CERT_ALERT_SECURITY_LDAP_USER_SEARCH_BASE: ${CERT_ALERT_LDAP_USER_SEARCH_BASE:-ou=people}
      # Whoever should be able to trigger jobs; any value the directory knows them by.
      # alice is the generated directory's administrator.
      CERT_ALERT_SECURITY_ADMIN_IDENTIFIERS: ${CERT_ALERT_ADMINS:-alice@intelink.ic.gov}
    ports:
      - "8080:8080"
    # X.509 client certificates need TLS, which needs keystores. Mount them read-only
    # rather than baking them into the image, and set CERT_ALERT_TLS_ENABLED=true plus the
    # keystore variables. Commented out so a first run does not need a ./tls directory.
    # volumes:
    #   - ./tls:/etc/cert-alert/tls:ro
    restart: unless-stopped

volumes:
  postgres-data:
  ldap-data:
